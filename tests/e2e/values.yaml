# Chart values for the end-to-end tests (tests/e2e/setup.sh): the images
# built from this checkout, the dependencies of tests/e2e/deps.yaml (S3,
# GCS and Azure on emulators), auth
# off (every request is the anonymous principal), small task volumes.
# setup.sh sets the image tags.
image:
  registry: docker.io
  repository: library/poiesis
  pullPolicy: Never

migrations:
  image:
    registry: docker.io
    repository: library/poiesis-migrations
    pullPolicy: Never

database:
  existingSecret: poiesis-db

s3:
  endpoint: http://s3:9000
  region: us-east-1
  existingSecret: poiesis-s3

gcs:
  enabled: true
  endpoint: http://gcs:4443
  existingSecret: poiesis-gcs

azure:
  enabled: true
  accountName: devstoreaccount1
  endpoint: http://azurite:10000/devstoreaccount1
  existingSecret: poiesis-azure

# A second S3 store on the same SeaweedFS, with keys that open only its
# bucket (deps.yaml).
objectStores:
  - name: second
    provider: s3
    buckets: ["poiesis-e2e-second"]
    endpoint: http://s3:9000
    region: us-east-1
    existingSecret: poiesis-s3-second

auth:
  enabled: false

logLevel: DEBUG

taskpods:
  persistence:
    defaultSizeGi: 1
    maxSizeGi: 2
  activeDeadlineSeconds: 600
