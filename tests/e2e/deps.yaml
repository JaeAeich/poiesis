# CI-only dependencies for the end-to-end tests: Postgres, an S3 store
# (SeaweedFS) and the Secrets the chart reads. No volumes, no auth
# provider: the cluster is thrown away after the run. Applied into the
# `poiesis` namespace by tests/e2e/setup.sh.
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-db
type: Opaque
stringData:
  DATABASE_URL: postgresql://poiesis:poiesis@postgres:5432/poiesis?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: poiesis
            - name: POSTGRES_PASSWORD
              value: poiesis
            - name: POSTGRES_DB
              value: poiesis
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "poiesis"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
# Same server as deployment/dev.yaml, with one identity (admin/password).
apiVersion: v1
kind: Secret
metadata:
  name: s3-config
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [{"accessKey": "admin", "secretKey": "password"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
            - -s3
            - -s3.port=9000
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
              value: "1"
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          secret:
            secretName: s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 9000
