# CI-only dependencies for the end-to-end tests: Postgres, one emulator per
# object store (SeaweedFS for S3, fake-gcs-server for GCS, Azurite for
# Azure) and the Secrets the chart reads. No volumes, no auth provider: the
# cluster is thrown away after the run. Applied into the `poiesis`
# namespace by tests/e2e/setup.sh.
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-db
type: Opaque
stringData:
  DATABASE_URL: postgresql://poiesis:poiesis@postgres:5432/poiesis?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
---
# fake-gcs-server takes no credentials. A key with disable_oauth makes
# obstore send unsigned requests instead of asking the metadata server.
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-gcs
type: Opaque
stringData:
  GOOGLE_SERVICE_ACCOUNT_KEY: >-
    {"disable_oauth": true, "client_email": "", "private_key": "",
    "private_key_id": ""}
---
# Azurite's development account key, published in its docs.
apiVersion: v1
kind: Secret
metadata:
  name: poiesis-azure
type: Opaque
stringData:
  AZURE_STORAGE_ACCOUNT_KEY: >-
    Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: poiesis
            - name: POSTGRES_PASSWORD
              value: poiesis
            - name: POSTGRES_DB
              value: poiesis
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "poiesis"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
# Same server as deployment/dev.yaml, with one identity (admin/password).
apiVersion: v1
kind: Secret
metadata:
  name: s3-config
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [{"accessKey": "admin", "secretKey": "password"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
            - -s3
            - -s3.port=9000
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
              value: "1"
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          secret:
            secretName: s3-config
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 9000
---
# GCS emulator. tustvold/fake-gcs-server is fsouza/fake-gcs-server with
# the XML API that obstore uses (fsouza/fake-gcs-server#1164); obstore's
# upstream tests run against the same image. It has no XML multipart
# upload, so the GCS end-to-end case keeps files below one part.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcs
  template:
    metadata:
      labels:
        app: gcs
    spec:
      containers:
        - name: fake-gcs-server
          image: tustvold/fake-gcs-server@sha256:dcd3aeacc07c731f1336e90c2889be2af8626ae993ee1fe2c0ba042ebbeb5a04
          args:
            - -scheme=http
            - -port=4443
            - -backend=memory
            - -public-host=gcs:4443
          ports:
            - containerPort: 4443
          readinessProbe:
            tcpSocket:
              port: 4443
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: gcs
spec:
  selector:
    app: gcs
  ports:
    - port: 4443
---
# Azure Blob emulator, blob service only, in memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azurite
  template:
    metadata:
      labels:
        app: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.38.0
          command: ["azurite-blob"]
          args:
            - --blobHost=0.0.0.0
            - --blobPort=10000
            - --inMemoryPersistence
            - --loose
            - --skipApiVersionCheck
          ports:
            - containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: 10000
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector:
    app: azurite
  ports:
    - port: 10000
