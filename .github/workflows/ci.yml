name: CI

on:
  pull_request:
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff format --check poiesis

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check poiesis

  deptry:
    name: deptry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run deptry poiesis

  typecheck:
    name: ty (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # ty is pre-1.0 and kubernetes-stubs is incomplete; advisory until the v2 rewrite lands clean types
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ty check poiesis

  test:
    name: pytest
    runs-on: ubuntu-latest
    services:
      # For the SQL tests (tests/unit/*_db.py); POIESIS_TEST_REQUIRE_DATABASE
      # turns their skip into an error, so they can't silently stop running.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POIESIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POIESIS_TEST_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run pytest

  chart:
    name: chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      # Schema checks, helm lint --strict and helm template per ci/*.yaml.
      - run: mise run chart:lint

  e2e:
    name: e2e (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POIESIS_E2E_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/images/Dockerfile
          tags: poiesis:e2e
          load: true
          cache-from: type=gha,scope=e2e-poiesis
          cache-to: type=gha,mode=max,scope=e2e-poiesis
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/images/migrations.Dockerfile
          tags: poiesis-migrations:e2e
          load: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: poiesis-e2e
      # Postgres, SeaweedFS, the chart with auth off (tests/e2e/values.yaml).
      - run: tests/e2e/setup.sh
        env:
          SKIP_BUILD: "1"
          SKIP_CLUSTER: "1"
      - name: port-forward the API
        run: |
          kubectl --context kind-poiesis-e2e -n poiesis port-forward svc/poiesis-api 8000:8000 \
            > port-forward.log 2>&1 &
          timeout 60 sh -c 'until curl -sf "$POIESIS_E2E_URL/ga4gh/tes/v1/service-info"; do sleep 1; done'
      # The slow case (missing image, 5-minute pending timeout) is left out.
      - run: uv run pytest tests/e2e -v -rxs
      - name: TES compliance suite
        run: tests/e2e/compliance.sh "$POIESIS_E2E_URL"
      - name: cluster state
        if: failure()
        run: |
          k="kubectl --context kind-poiesis-e2e -n poiesis"
          $k get all,jobs,pvc -o wide
          $k get events --sort-by=.lastTimestamp | tail -50
          $k logs deploy/poiesis-api --tail=200
          $k logs deploy/poiesis-tctl --tail=200
          cat port-forward.log

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- typos .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- markdownlint '**/*.md' --ignore node_modules --ignore .venv --ignore 'docs/app/**'

  editorconfig:
    name: eclint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- eclint check $(git ls-files '*.py' '*.toml' '*.yaml' '*.yml' '*.json' '*.md' '*.sh' | grep -v '^docs/app/')

  toml-hygiene:
    name: toml-sort + taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- toml-sort --check --all --trailing-comma-inline-array $(git ls-files '*.toml' | grep -v '^uv\.lock$')
      - run: mise x -- taplo format --check $(git ls-files '*.toml' | grep -v '^uv\.lock$')

  docs-build:
    name: docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # dead internal links fail the build
      - run: npm run docs:build

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: |
          COMMITLINT_CONFIG_DIR="$(mise where 'npm:@commitlint/config-conventional')" \
          mise x -- commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
