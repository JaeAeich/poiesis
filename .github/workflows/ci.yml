name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff format --check poiesis

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check poiesis

  deptry:
    name: deptry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run deptry poiesis

  typecheck:
    name: ty (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # ty is pre-1.0 and kubernetes-stubs is incomplete; advisory until the v2 rewrite lands clean types
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run ty check poiesis

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- typos .

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- markdownlint '**/*.md' --ignore node_modules --ignore .venv --ignore 'docs/app/**'

  editorconfig:
    name: eclint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- eclint check $(git ls-files '*.py' '*.toml' '*.yaml' '*.yml' '*.json' '*.md' '*.sh' | grep -v '^docs/app/')

  toml-hygiene:
    name: toml-sort + taplo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: mise x -- toml-sort --check --all --trailing-comma-inline-array $(git ls-files '*.toml' | grep -v '^uv\.lock$')
      - run: mise x -- taplo format --check $(git ls-files '*.toml' | grep -v '^uv\.lock$')

  diagrams-drift:
    name: diagrams drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run diagrams
      - name: fail if SVGs out of date
        run: |
          if ! git diff --exit-code -- public/diagrams; then
            echo "Mermaid SVGs are stale. Run 'npm run diagrams' in docs/app and commit." >&2
            exit 1
          fi

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - run: |
          NODE_PATH="$(mise where 'npm:@commitlint/config-conventional')/lib/node_modules" \
          "$(mise where 'npm:@commitlint/cli')/bin/commitlint" \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
