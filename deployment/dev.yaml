# Dev-only manifest: stands up Postgres + S3 (SeaweedFS) + Keycloak + Poiesis
# (API + TCtl) on a local cluster (OrbStack). Not for production — the
# real chart lives in deployment/helm. This file is deliberately
# one-shot: hardcoded creds, imagePullPolicy=IfNotPresent against
# locally-built images, no probes tuning, no PDB/HPA. Apply with:
#
#   docker build -f deployment/images/Dockerfile            -t poiesis:dev            .
#   docker build -f deployment/images/migrations.Dockerfile -t poiesis-migrations:dev .
#   kubectl apply -f deployment/dev.yaml
#   kubectl -n po wait --for=condition=Available deploy/poiesis-api --timeout=240s
#   kubectl -n po port-forward svc/poiesis-api 8000:8000 &
#   kubectl -n deps port-forward svc/s3 9000:9000 &
#   kubectl -n deps port-forward svc/keycloak 8080:8080 &
---
apiVersion: v1
kind: Namespace
metadata:
  name: deps
---
apiVersion: v1
kind: Namespace
metadata:
  name: po
---
################################################################################
# POSTGRES
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: deps
type: Opaque
stringData:
  POSTGRES_USER: poiesis
  POSTGRES_PASSWORD: poiesis
  POSTGRES_DB: poiesis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: deps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "poiesis"]
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: deps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: deps
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
################################################################################
# S3 (SeaweedFS)
################################################################################
# S3-compatible object store for TIF/TOF inputs/outputs and Nextflow's
# workDir. MinIO no longer publishes free images, so this is SeaweedFS
# (Apache-2.0): master, volume server, filer and S3 gateway in one process.
# S3 on port 9000, one identity: access key `admin`, secret `password`.
# Buckets aren't created on demand; make them with `weed shell` (see the
# quickstart: docs/start/quickstart).
apiVersion: v1
kind: Secret
metadata:
  name: s3
  namespace: deps
type: Opaque
stringData:
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [{"accessKey": "admin", "secretKey": "password"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  namespace: deps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          command: ["weed"]
          # Each bucket is a collection with volumes of its own. Small
          # volumes, grown one at a time, and as many as the disk holds
          # (max 0), so a 1Gi volume fits more than a couple of buckets.
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=64
            - -volume.max=0
            - -s3
            - -s3.port=9000
            - -s3.config=/etc/seaweedfs/s3.json
          env:
            - name: WEED_MASTER_VOLUME_GROWTH_COPY_1
              value: "1"
          ports:
            - containerPort: 9000
              name: s3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s3
        - name: config
          secret:
            secretName: s3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3
  namespace: deps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: deps
spec:
  type: ClusterIP
  selector:
    app: s3
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
################################################################################
# KEYCLOAK (dev IdP)
################################################################################
# Realm `poiesis`, imported on start. KC_HOSTNAME pins every issued token's
# `iss` to the in-cluster URL, so tokens fetched through a port-forward from
# the host validate in the API too. Users (password = username):
#   alice, carol -> group lab-alpha    bob -> lab-beta    admin -> poiesis-admins
# Clients:
#   poiesis-cli  public; auth code + PKCE, device flow, password grant (dev only);
#                also the Swagger UI login at http://localhost:{8000,18000}/docs
#   poiesis-ci   confidential, client credentials; secret: poiesis-ci-secret
# User ids are fixed, so `sub` (and the task owner `<issuer>|<sub>`) survives
# Keycloak restarts. Keycloak keeps no data volume: `kubectl -n deps rollout
# restart deploy/keycloak` re-imports the realm after editing it. Its signing
# keys change on restart; the API refetches them on the first unknown `kid`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: deps
data:
  poiesis-realm.json: |
    {
      "realm": "poiesis",
      "enabled": true,
      "sslRequired": "none",
      "accessTokenLifespan": 300,
      "groups": [
        {
          "name": "lab-alpha"
        },
        {
          "name": "lab-beta"
        },
        {
          "name": "poiesis-admins"
        }
      ],
      "users": [
        {
          "id": "00000000-0000-4000-8000-00000000a11c",
          "username": "alice",
          "enabled": true,
          "emailVerified": true,
          "email": "alice@example.org",
          "firstName": "Alice",
          "lastName": "Dev",
          "credentials": [
            {
              "type": "password",
              "value": "alice",
              "temporary": false
            }
          ],
          "groups": [
            "/lab-alpha"
          ]
        },
        {
          "id": "00000000-0000-4000-8000-00000000ca01",
          "username": "carol",
          "enabled": true,
          "emailVerified": true,
          "email": "carol@example.org",
          "firstName": "Carol",
          "lastName": "Dev",
          "credentials": [
            {
              "type": "password",
              "value": "carol",
              "temporary": false
            }
          ],
          "groups": [
            "/lab-alpha"
          ]
        },
        {
          "id": "00000000-0000-4000-8000-000000000b0b",
          "username": "bob",
          "enabled": true,
          "emailVerified": true,
          "email": "bob@example.org",
          "firstName": "Bob",
          "lastName": "Dev",
          "credentials": [
            {
              "type": "password",
              "value": "bob",
              "temporary": false
            }
          ],
          "groups": [
            "/lab-beta"
          ]
        },
        {
          "id": "00000000-0000-4000-8000-00000000ad01",
          "username": "admin",
          "enabled": true,
          "emailVerified": true,
          "email": "admin@example.org",
          "firstName": "Admin",
          "lastName": "Dev",
          "credentials": [
            {
              "type": "password",
              "value": "admin",
              "temporary": false
            }
          ],
          "groups": [
            "/poiesis-admins"
          ]
        },
        {
          "id": "00000000-0000-4000-8000-0000000000c1",
          "username": "service-account-poiesis-ci",
          "enabled": true,
          "serviceAccountClientId": "poiesis-ci"
        }
      ],
      "clients": [
        {
          "clientId": "poiesis-cli",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://localhost:8000/*",
            "http://localhost:18000/docs/oauth2-redirect"
          ],
          "webOrigins": [
            "+",
            "http://localhost:18000"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "oauth2.device.authorization.grant.enabled": "true"
          },
          "protocolMappers": [
            {
              "name": "audience-poiesis",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "poiesis",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "poiesis-ci",
          "publicClient": false,
          "secret": "poiesis-ci-secret",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "protocolMappers": [
            {
              "name": "audience-poiesis",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.custom.audience": "poiesis",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: deps
spec:
  replicas: 1
  # One pod at a time: each dev-mode pod has its own H2 database and keys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME
              value: http://keycloak.deps.svc:8080
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: deps
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
################################################################################
# POIESIS SHARED CONFIG / RBAC
################################################################################
apiVersion: v1
kind: Secret
metadata:
  name: poiesis
  namespace: po
type: Opaque
stringData:
  DATABASE_URL: postgresql://poiesis:poiesis@postgres.deps.svc.cluster.local:5432/poiesis?sslmode=disable
  AWS_ENDPOINT_URL: http://s3.deps.svc.cluster.local:9000
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
  AWS_REGION: us-east-1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: poiesis
  namespace: po
data:
  POIESIS_NAMESPACE: po
  POIESIS_TASKPOD_NAMESPACE: po
  POIESIS_IMAGE: poiesis:dev
  POIESIS_TASKPOD_SERVICE_ACCOUNT: poiesis-taskpod
  POIESIS_POD_SECURITY_ENFORCE: restricted
  LOG_LEVEL: INFO
  POIESIS_AUTH_ENABLED: "true"
  # Keycloak types its access tokens `JWT`, not RFC 9068's `at+jwt`, hence
  # tokenTypes. Only the realm's two clients' tokens are accepted. Only
  # poiesis-cli logins (Swagger UI, password grant) may mint API keys;
  # the poiesis-ci service account may not. No maxAuthAge: Keycloak puts
  # no auth_time in password-grant tokens, which the docs use to mint.
  # Members of poiesis-admins (the user admin) are built-in admins: they
  # may list and revoke anyone's API keys. adminRead stays off, so they
  # see their own tasks only.
  POIESIS_AUTH_ISSUERS: >-
    [{"issuer": "http://keycloak.deps.svc:8080/realms/poiesis",
      "audience": "poiesis",
      "tokenTypes": ["JWT"],
      "clients": ["poiesis-cli", "poiesis-ci"],
      "keyMinting": {"clients": ["poiesis-cli"]},
      "admin": {"name": "groups", "values": ["poiesis-admins"]}}]
  # The URL the docs reach the API at (port-forward); clients discover
  # the issuer from <it>/.well-known/oauth-protected-resource or a 401.
  POIESIS_AUTH_RESOURCE: http://localhost:8000
  POIESIS_AUTH_API_KEYS_ENABLED: "true"
  POIESIS_AUTH_API_KEYS_DEFAULT_TTL: 7d
  POIESIS_AUTH_API_KEYS_MAX_TTL: 90d
  POIESIS_AUTH_API_KEYS_MAX_PER_OWNER: "20"
  # Swagger UI login (/docs). The browser fetches the issuer's discovery
  # document itself, so keycloak.deps.svc must resolve on the host (hosts
  # entry + Keycloak port-forward, see docs/guides/keycloak).
  POIESIS_AUTH_SWAGGER_UI_ISSUER: http://keycloak.deps.svc:8080/realms/poiesis
  POIESIS_AUTH_SWAGGER_UI_CLIENT_ID: poiesis-cli
  POIESIS_AUTH_SWAGGER_UI_SCOPES: openid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poiesis-api
  namespace: po
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poiesis-tctl
  namespace: po
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poiesis-taskpod
  namespace: po
---
# API submits and (on cancel) deletes Jobs; creates PVCs with an
# ownerReference back to the Job so kube-controller-manager handles PVC
# garbage collection. No jobs/finalizers permission is needed: the
# ownerReference sets blockOwnerDeletion: false.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: poiesis-api
  namespace: po
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: poiesis-api
  namespace: po
subjects:
  - kind: ServiceAccount
    name: poiesis-api
    namespace: po
roleRef:
  kind: Role
  name: poiesis-api
  apiGroup: rbac.authorization.k8s.io
---
# TCtl: read-only over taskpods (and their logs, to backfill executor
# output) + leases for leader election. It never deletes pods or jobs — the
# API owns the delete path.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: poiesis-tctl
  namespace: po
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: poiesis-tctl
  namespace: po
subjects:
  - kind: ServiceAccount
    name: poiesis-tctl
    namespace: po
roleRef:
  kind: Role
  name: poiesis-tctl
  apiGroup: rbac.authorization.k8s.io
---
# TaskPod: trec watches its own Pod and reads its executors' logs via the
# K8s API. The token is mounted into trec only, not into executors.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: poiesis-taskpod
  namespace: po
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: poiesis-taskpod
  namespace: po
subjects:
  - kind: ServiceAccount
    name: poiesis-taskpod
    namespace: po
roleRef:
  kind: Role
  name: poiesis-taskpod
  apiGroup: rbac.authorization.k8s.io
---
################################################################################
# MIGRATIONS
################################################################################
apiVersion: batch/v1
kind: Job
metadata:
  name: poiesis-migrate
  namespace: po
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: poiesis-migrations:dev
          imagePullPolicy: IfNotPresent
          args:
            - -database
            - $(DATABASE_URL)
            - up
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: poiesis
                  key: DATABASE_URL
---
################################################################################
# POIESIS API
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poiesis-api
  namespace: po
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poiesis-api
  template:
    metadata:
      labels:
        app: poiesis-api
    spec:
      serviceAccountName: poiesis-api
      containers:
        - name: api
          image: poiesis:dev
          imagePullPolicy: IfNotPresent
          command: [poiesis, api, run]
          envFrom:
            - secretRef:
                name: poiesis
            - configMapRef:
                name: poiesis
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /startupz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: poiesis-api
  namespace: po
spec:
  type: ClusterIP
  selector:
    app: poiesis-api
  ports:
    - port: 8000
      targetPort: 8000
---
################################################################################
# POIESIS TCTL
################################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poiesis-tctl
  namespace: po
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poiesis-tctl
  template:
    metadata:
      labels:
        app: poiesis-tctl
    spec:
      serviceAccountName: poiesis-tctl
      containers:
        - name: tctl
          image: poiesis:dev
          imagePullPolicy: IfNotPresent
          command: [poiesis, tctl, run]
          envFrom:
            - secretRef:
                name: poiesis
            - configMapRef:
                name: poiesis
          env:
            - name: POIESIS_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
