# Minimal values used by `helm lint -f ci/lint-values.yaml` to validate
# the chart renders cleanly. Production deploys MUST supply their own
# database.existingSecret pointing at an operator-managed Secret.
database:
  existingSecret: poiesis-db

auth:
  enabled: true
  issuers:
    - issuer: https://keycloak.example.org/realms/poiesis
      audience: poiesis
      tokenTypes: [JWT]
      clients: [poiesis-cli]
      requiredClaim:
        name: groups
        prefixes: [/poiesis-]
      # Built-in admins (no decision service here), with task read.
      admin:
        name: groups
        values: [/poiesis-admins]
  swaggerUi:
    issuer: https://keycloak.example.org/realms/poiesis
    clientId: poiesis-cli

authz:
  adminRead: true

# Off, so that an explicit false is rendered as false.
audit:
  enabled: false
