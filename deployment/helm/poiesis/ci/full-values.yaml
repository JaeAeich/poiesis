# Complete values fixture used by `check-jsonschema` in CI to validate the
# merged input the chart would actually receive. Mirrors values.yaml's
# shape and supplies the operator-required keys (database.existingSecret).
# Edit this when adding new required fields to the schema.

image:
  registry: docker.io
  repository: jaeaeich/poiesis
  pullPolicy: IfNotPresent

migrations:
  image:
    registry: docker.io
    repository: jaeaeich/poiesis-migrations
    pullPolicy: IfNotPresent

database:
  existingSecret: poiesis-db
  existingSecretKey: DATABASE_URL

auth:
  enabled: true
  issuers:
    - issuer: https://keycloak.example.org/realms/poiesis
      audience: poiesis
      principalClaim: sub
      requiredScopes: [openid]
      jwksCacheTtl: 600
      clockSkew: 10
      timeout: 2.5
      userinfo:
        enabled: true
      keyMinting:
        clients: [poiesis-cli]
        maxAuthAge: 600
    # A gateway signing its own JWTs: keys only, no discovery.
    - issuer: https://gateway.example.org
      audience: poiesis
      jwksUri: http://gateway.mesh.svc.cluster.local/.well-known/jwks.json
  apiKeys:
    enabled: true
    defaultTtl: 7d
    maxTtl: 720h
    maxPerOwner: 5
  swaggerUi:
    issuer: https://keycloak.example.org/realms/poiesis
    clientId: poiesis-cli
    scopes: openid profile

authz:
  requiredClaim:
    name: eduperson_entitlement
    values:
      - "urn:geant:lifescience-ri.eu:group:example-vo#login.aai.lifescience-ri.eu"
    prefixes:
      - "urn:geant:lifescience-ri.eu:group:example-vo:"
  decisionService:
    url: http://localhost:8181/access/v1/evaluation
    timeout: 2
    claims: [eduperson_entitlement]
    credentialFile: /var/run/secrets/authz/token

api:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8000

tctl:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

taskpods:
  persistence:
    defaultSizeGi: 10
    maxSizeGi: 100
    accessModes:
      - ReadWriteOnce
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
