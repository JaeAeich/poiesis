# Complete values fixture used by `check-jsonschema` in CI to validate the
# merged input the chart would actually receive. Mirrors values.yaml's
# shape and supplies the operator-required keys (database.existingSecret).
# Edit this when adding new required fields to the schema.

image:
  registry: docker.io
  repository: jaeaeich/poiesis
  pullPolicy: IfNotPresent

migrations:
  image:
    registry: docker.io
    repository: jaeaeich/poiesis-migrations
    pullPolicy: IfNotPresent

database:
  existingSecret: poiesis-db
  existingSecretKey: DATABASE_URL

auth:
  enabled: true
  issuers:
    - issuer: https://keycloak.example.org/realms/poiesis
      # Two audiences while moving from a shared to a per-instance one.
      audience: [poiesis-node-1, poiesis]
      # Keycloak's access tokens are typed `JWT`, not `at+jwt`.
      tokenTypes: [JWT]
      clients: [poiesis-cli, portal]
      principalClaim: sub
      requiredScopes: [openid]
      requiredClaim:
        name: eduperson_entitlement
        values:
          - "urn:geant:lifescience-ri.eu:group:example-vo#login.aai.lifescience-ri.eu"
        prefixes:
          - "urn:geant:lifescience-ri.eu:group:example-vo:"
      actors: [gateway-client]
      # Ignored here (a decision service is set; startup WARNING), but
      # validated by the schema.
      admin:
        name: eduperson_entitlement
        prefixes:
          - "urn:geant:lifescience-ri.eu:group:example-vo:admins"
      jwksCacheTtl: 600
      clockSkew: 10
      timeout: 2.5
      userinfo:
        enabled: true
      keyMinting:
        clients: [poiesis-cli]
        maxAuthAge: 600
    # The same Keycloak under its new URL: sharing the old URL as
    # namespace keeps its owners' tasks and keys.
    - issuer: https://login.example.org/realms/poiesis
      audience: poiesis
      namespace: https://keycloak.example.org/realms/poiesis
    # A gateway signing its own JWTs: keys only, no discovery.
    - issuer: https://gateway.example.org
      audience: poiesis
      tokenTypes: []
      namespace: gateway
      jwksUri: http://gateway.mesh.svc.cluster.local/.well-known/jwks.json
  apiKeys:
    enabled: true
    defaultTtl: 7d
    maxTtl: 720h
    maxPerOwner: 5
  swaggerUi:
    issuer: https://keycloak.example.org/realms/poiesis
    clientId: poiesis-cli
    scopes: openid profile

authz:
  decisionService:
    url: http://localhost:8181/access/v1/evaluation
    timeout: 2
    claims: [eduperson_entitlement]
    credentialFile: /var/run/secrets/authz/token
  sharing: true
  maxOwners: 2000000
  adminRead: false

audit:
  enabled: true

api:
  replicas: 2
  probes:
    readiness:
      failureThreshold: 2
    liveness:
      failureThreshold: 6
  preStopSleepSeconds: 10
  terminationGracePeriodSeconds: 45
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8000

tctl:
  replicas: 1
  unschedulableTimeoutSeconds: 900
  probes:
    liveness:
      enabled: true
      maxHeartbeatAgeSeconds: 900
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

taskpods:
  databaseSecret: poiesis-db-tasks
  s3Secret: poiesis-s3-tasks
  persistence:
    defaultSizeGi: 10
    maxSizeGi: 100
    accessModes:
      - ReadWriteOnce
  activeDeadlineSeconds: 86400
  systemResources:
    recorder:
      requests:
        cpu: 20m
        memory: 128Mi
    filer:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
    # null: no requests or limits for ack.
    ack: null
  resources:
    defaultCpuCores: 1
    defaultRamGb: 2
    maxCpuCores: 64
    maxRamGb: 512
    cpuLimit: false
  nodeSelector:
    poiesis.io/workload: tasks
  tolerations:
    - {key: tasks, operator: Exists, effect: NoSchedule}
  priorityClassName: tasks-default
  runtimeClassName: ""
  preemptible:
    nodeSelector:
      cloud.google.com/gke-spot: "true"
    tolerations:
      - {key: cloud.google.com/gke-spot, operator: Equal, value: "true", effect: NoSchedule}
  gpu:
    maxCount: 4
  backendParameters:
    allowed: [gpu_count, priority_class, node_pool]
    priorityClasses: [tasks-high]
    nodePools:
      highmem:
        nodeSelector: {pool: highmem}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

metrics:
  port: 9100
  scrapeAnnotations: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 15s

networkPolicy:
  enabled: true
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  databaseEgress:
    port: 6432
    to:
      - ipBlock:
          cidr: 10.0.12.0/24
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  ingressFromPodSelector:
    app: monitoring
  extraEgress:
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - protocol: TCP
          port: 9000
