# Default values for poiesis.
#
# Layered defaults:
#
#   Top level    → chart-wide settings every component inherits.
#   api: / tctl: → per-component overrides; only what differs from the top
#                  level. Image, security context, env, volumes, node
#                  scheduling all fall through to top-level when unset.
#   taskpods:    → workload-shape config baked into TaskPod manifests by
#                  the API at task-submit time. Distinct from the control
#                  plane: settings here affect what runs *for* a TES task,
#                  not the control plane itself.
#
# This chart NEVER creates Secrets for credentials. The operator must
# pre-create the database (and optional S3) Secret; the chart references
# it by name via existingSecret. values.schema.json enforces required keys.

# Name overrides. Empty values fall back to the chart's release name.
nameOverride: ""
fullnameOverride: ""

# Labels and annotations propagated to every resource the chart renders.
# Useful for cost allocation, multi-tenant cluster tagging, ownership audit.
commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------------------------------------
# Chart-wide defaults (top level)
# -----------------------------------------------------------------------------

image:
  # registry + repository are kept separate so policy engines that scan for a
  # specific registry can match registry alone.
  registry: docker.io
  repository: jaeaeich/poiesis
  # Defaults to .Chart.AppVersion when empty so freshly-pulled charts pin to
  # their declared appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# imagePullSecrets propagate to api, tctl, migration hook, and every taskpod.
# Operators using IRSA / Workload Identity for runtime image pulls leave this
# empty.
imagePullSecrets: []
# - name: ghcr-pull-secret

# Pod-level securityContext applied to api, tctl, and the migration hook.
# Container-level lives under containerSecurityContext below.
# Both default to a profile derived from podSecurityEnforce (see below).
podSecurityContext: {}
containerSecurityContext: {}

# PodSecurity profile applied to poiesis-owned containers (api, tctl, hook,
# and per-TaskPod trec/tif/tof/ack). Executor containers in TaskPods always
# run user-supplied images and are exempt — operators needing constraints on
# user code should rely on the namespace's PodSecurity admission level.
#
# Allowed: restricted | baseline | off.
podSecurityEnforce: restricted

# Default pod scheduling. Per-component overrides win when set.
nodeSelector: {}
tolerations: []
affinity: {}

# Extension points. Per-component extras APPEND to these — top-level wins
# nothing; component-level wins nothing; they coexist. Duplicate names will
# be rejected by Kubernetes admission. Operators must avoid collisions.
extraEnv: []
# - name: SENTRY_DSN
#   value: https://...

extraEnvFrom: []
# - secretRef:
#     name: observability-tokens

extraVolumes: []
# - name: shared-ca
#   configMap:
#     name: corp-ca-bundle

extraVolumeMounts: []
# - name: shared-ca
#   mountPath: /etc/ssl/corp
#   readOnly: true

# Arbitrary manifests rendered verbatim by the chart. Trapdoor for everything
# the chart doesn't model: NetworkAttachmentDefinitions, custom CRs, sealed
# secrets, etc. Each entry is a string or template rendering to one or more
# YAML docs.
extraManifests: []
# - |
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: extra-config
#   data:
#     key: value

# Service accounts. Per-component create=true mints a chart-managed SA; set
# create=false and name=<existing> to bind an out-of-band SA (typical for
# IRSA / Workload Identity).
serviceAccount:
  api:
    create: true
    name: ""
    annotations: {}
  tctl:
    create: true
    name: ""
    annotations: {}
  taskpod:
    create: true
    name: ""
    annotations: {}

# Logging.
logLevel: INFO

# -----------------------------------------------------------------------------
# External dependencies (operator-supplied; chart does NOT create these)
# -----------------------------------------------------------------------------

# Postgres connection. The Secret must hold a full DATABASE_URL of the form:
#   postgresql://USER:PASS@HOST:PORT/DB?sslmode=verify-full&sslrootcert=/etc/ssl/poiesis/ca.crt
database:
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  # ConfigMap (key: ca.crt) mounted read-only at /etc/ssl/poiesis on api,
  # tctl, and every taskpod's poiesis-owned container. Empty disables.
  caConfigmap: ""

# Resource-server auth. Poiesis validates incoming JWTs itself, against the
# keys of the issuers listed here; a token's `iss` picks its issuer (exact
# match). When `enabled: true` (default) at least one issuer is REQUIRED —
# the schema rejects an empty list at `helm install` time. When
# `enabled: false` the API accepts every request as a fixed anonymous
# principal; intended for local dev and air-gapped single-tenant
# deployments only. Rendered as POIESIS_AUTH_ISSUERS (JSON).
auth:
  enabled: true
  # One entry per trusted issuer. Keys per entry:
  #   issuer          REQUIRED. Exact `iss` of the tokens, e.g.
  #                   https://keycloak.example.org/realms/poiesis. Also the
  #                   OIDC discovery base URL; the discovery document's
  #                   `issuer` must equal it exactly.
  #   audience        REQUIRED. Accepted `aud` claim: a string, or a list
  #                   of which the token's `aud` must hold one. Use one
  #                   value per Poiesis instance; several only during a
  #                   migration (e.g. shared -> per-instance audience).
  #   tokenTypes      Accepted JWT header `typ` values, compared without
  #                   case, `application/` optional (default [at+jwt],
  #                   RFC 9068 access tokens), so that ID tokens and other
  #                   JWTs of the issuer are refused. Keycloak access
  #                   tokens carry `JWT` by default: list [JWT]. [] turns
  #                   the check off (weaker: any JWT of the issuer with
  #                   the audience passes).
  #   clients         OAuth clients (token `azp`, else `client_id`) whose
  #                   tokens are accepted; tokens of other clients, or
  #                   without one, get 401. Unset: any client.
  #   namespace       Prefix of the owner id stamped on tasks and keys:
  #                   `<namespace>|<subject>` (default: the issuer). No
  #                   `|`. When an issuer's URL changes, give the new
  #                   entry the old URL as namespace so owners stay the
  #                   same (a startup WARNING names issuers sharing one).
  #   principalClaim  Claim naming the subject (default `sub`). Dotted
  #                   paths walk nested objects (`ctx.group_id`).
  #   requiredScopes  Scopes a token MUST carry (default none).
  #   requiredClaim   Admission rule for this issuer's tokens (and keys
  #                   minted with them): {name, values, prefixes}. The
  #                   claim `name` (exact name first, then a dotted path;
  #                   token first, then userinfo) must be a string or
  #                   list of strings holding one of `values` or
  #                   starting with one of `prefixes`, else 403. Prefixes
  #                   are raw: include the delimiter (`urn:...:vo:`).
  #                   Never applies to other issuers' tokens. Unset: all
  #                   of the issuer's tokens are admitted.
  #   admin           Built-in admin rule for this issuer's tokens:
  #                   {name, values, prefixes}, matched like requiredClaim.
  #                   Applies only without a decision service (with one,
  #                   admin is its policy and this is ignored, with a
  #                   startup WARNING). Admins may list and revoke any
  #                   owner's API keys (offboarding), and with
  #                   authz.adminRead also list, get and cancel every
  #                   task. Never applies to delegated tokens.
  #   actors          Actors (RFC 8693 `act.sub`, e.g. a gateway's client
  #                   id) whose delegated tokens of this issuer the
  #                   built-in policy accepts when there is no decision
  #                   service; other delegated tokens get 403.
  #   userinfo        {enabled: true} fetches the issuer's userinfo per
  #                   token (cached until it expires, at most 5 minutes)
  #                   for claims missing from access tokens (default off).
  #   jwksUri         Static JWKS URL; skips discovery. For gateways
  #                   (Envoy, Istio, oauth2-proxy) that sign their own
  #                   JWTs. Can't be combined with userinfo.
  #   jwksCacheTtl    Seconds to cache the keys (default 3600). Unknown
  #                   `kid`s refetch them anyway, at most every 30 s.
  #   clockSkew       Seconds of leeway on exp/nbf/iat (default 30).
  #   timeout         Seconds per call to the issuer (default 10).
  #   keyMinting      Which of its tokens may mint API keys; without it,
  #                   none may. {clients: [...]} lists the OAuth clients
  #                   (token `azp`, else `client_id`) allowed, normally
  #                   the interactive login client, not service accounts.
  #                   maxAuthAge (seconds) also requires a recent login
  #                   (`auth_time` in the access token).
  # Example:
  #   issuers:
  #     - issuer: https://keycloak.example.org/realms/poiesis
  #       audience: poiesis
  #       tokenTypes: [JWT]
  #       clients: [poiesis-cli, portal]
  #       requiredClaim: {name: groups, values: [/poiesis-users]}
  #       admin: {name: groups, values: [/poiesis-admins]}
  #       keyMinting: {clients: [poiesis-cli], maxAuthAge: 600}
  #     - issuer: https://gateway.example.org
  #       audience: poiesis
  #       jwksUri: http://gateway.mesh.svc/.well-known/jwks.json
  issuers: []
  # Public URL of this Poiesis, e.g. https://poiesis.example.org (no
  # query, fragment or credentials; a trailing / is dropped). Clients
  # discover how to authenticate from it: Poiesis serves OAuth 2.0
  # Protected Resource Metadata (RFC 9728) at
  # <origin>/.well-known/oauth-protected-resource<path>, listing the
  # issuers above, and every 401 points there in WWW-Authenticate. With
  # a path (https://example.org/poiesis), route that well-known URL to
  # the API too. Empty: no metadata; 401s carry a plain Bearer challenge.
  resource: ""
  # Poiesis API keys (`poi_...`) for clients that outlive an access token,
  # such as workflow engines. Owners mint them at POST /poiesis/v1/api-keys
  # with an OIDC token; see the "API keys" docs page. Off by default: an
  # add-on for clients that can't refresh tokens.
  apiKeys:
    enabled: false
    # Lifetime when the minting request names none, and the most it may
    # ask for: `<n>d` or `<n>h`. A key's claims are a snapshot from
    # minting, so changes at the IdP reach it only when it expires.
    defaultTtl: 7d
    maxTtl: 90d
    # Active (not revoked, not expired) keys an owner may hold.
    maxPerOwner: 20
  # Login offered by the Swagger UI at /docs (authorization code + PKCE),
  # so owners can mint keys from the browser. Documentation only: tokens
  # are validated as usual. Empty `issuer` turns it off.
  swaggerUi:
    # One of `issuers` above (exact match), with OIDC discovery.
    issuer: ""
    # Public client of that issuer that allows the redirect URI
    # <API URL>/docs/oauth2-redirect and the API's origin.
    clientId: ""
    # Space-separated scopes requested.
    scopes: openid

# Authorization (see the "Authorization" docs page). Off by default; when
# both an issuer's requiredClaim (above) and the decision service are set,
# both must allow. Needs auth.enabled. The former global
# `authz.requiredClaim` is refused: set it per issuer instead.
authz:
  # External decision service: an OpenID AuthZEN 1.0 Access Evaluation
  # endpoint asked once per decision. Empty `url` keeps the built-in
  # owner rule. Any failure or timeout is a 503.
  decisionService:
    # Full evaluation URL, e.g. http://localhost:8181/access/v1/evaluation
    url: ""
    # Seconds per evaluation.
    timeout: 2
    # Claims sent to the service in subject.properties.claims.
    claims: []
    # Optional path (in the API pod) of a file with a bearer credential
    # for the service; mount it from a Secret via extraVolumes and
    # extraVolumeMounts.
    credentialFile: ""
  # Let the decision service show tasks to others than their owner: list
  # `all`, a list `scope` (owners, groups, tags), others' tasks on get and
  # cancel, and `groups` set on create. Off: every task is visible to its
  # owner only, whatever the service answers. Needs decisionService.url.
  sharing: false
  # Most owners one list scope may name; a scope with more is denied (403)
  # and logged, so a runaway policy can't build an unbounded query.
  maxOwners: 1000
  # Give the built-in admins (auth.issuers[].admin, no decision service)
  # read and cancel of every task: list all, get and cancel any. Off: an
  # admin sees their own tasks only, as everyone does; task data
  # (inputs, outputs, logs, environment) is often granted to one person.
  # Revoking and listing others' API keys needs no adminRead.
  adminRead: false

# Audit log: one JSON object per line on the API's stdout (logger
# `poiesis.audit`) for every task authorization outcome and API key event,
# whatever logLevel says. Never tokens, keys or claim values. Retention is
# your log pipeline's.
audit:
  enabled: true

# GA4GH service info (GET /service-info): how registries and clients tell
# this deployment apart. Empty keeps the built-in value; `environment` is
# then left out and `createdAt` is the time of the request. `version` is
# always the Poiesis version, `type.version` the TES version. Invalid
# values stop the API from starting.
serviceInfo:
  # Unique id of this deployment, reverse domain name recommended, e.g.
  # org.example.tes.prod. Also sent to the decision service as
  # context.tes.service_id. Built-in: org.ga4gh.poiesis.
  id: ""
  # Human-readable name and description.
  name: ""
  description: ""
  # Who runs this deployment; `url` is an http(s) URL.
  organization:
    name: ""
    url: ""
  # http(s) URL of a contact form, or mailto:<address>.
  contactUrl: ""
  # http(s) URL of the documentation for this deployment's users.
  documentationUrl: ""
  # E.g. prod, test, dev or staging.
  environment: ""
  # When first deployed: ISO 8601 with a UTC offset, e.g.
  # 2026-01-15T09:00:00Z.
  createdAt: ""

# S3-compatible storage. Optional: required only when task inputs/outputs
# reference s3:// URLs.
s3:
  # Non-secret. AWS_ENDPOINT_URL — empty for real AWS S3.
  endpoint: ""
  # AWS_REGION.
  region: ""
  # Existing Secret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY. Empty
  # when using IRSA / IMDS credentials.
  existingSecret: ""

# -----------------------------------------------------------------------------
# API (TES HTTP endpoint)
# -----------------------------------------------------------------------------

api:
  replicas: 1

  # Image override (falls back to top-level image). Useful for canarying.
  image: {}
  # registry: ""
  # repository: ""
  # tag: ""
  # pullPolicy: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  probes:
    startup:
      enabled: true
      periodSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 2
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 2

  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: poiesis.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  pdb:
    enabled: false
    minAvailable: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  # Component-local extensions. Append to the chart-wide extras.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# TCtl (sole writer of terminal task state)
# -----------------------------------------------------------------------------

tctl:
  # Leader election means only one replica is active at a time. Increasing
  # this gives faster failover, not throughput.
  replicas: 1

  image: {}

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# TaskPod workload-shape config
#
# Settings here are baked into the TaskPod manifests the API builds at
# submit time. They affect what runs FOR a TES task, not the control plane.
# -----------------------------------------------------------------------------

taskpods:
  # Namespace TaskPods land in. Empty means same as release namespace.
  # When split, the chart renders the API + taskpod Roles in this namespace.
  namespace: ""

  persistence:
    # Default size when a TES request omits resources.disk_gb.
    defaultSizeGi: 10

    # Hard upper bound on resources.disk_gb. The API rejects submissions
    # over this with HTTP 400 before any pod is created. Production MUST
    # set this; the schema fails install if it's missing.
    maxSizeGi: 100

    # StorageClass for per-task PVCs. Three states:
    #   ""    → omit storageClassName; cluster default applies
    #   "-"   → set storageClassName: "" (disables dynamic provisioning,
    #           requires a pre-bound PV; matches kubectl convention)
    #   other → use that named StorageClass
    storageClass: ""

    # PVC access modes applied to every task. Cluster property: in this
    # architecture a task runs on one node, so RWO is sufficient. NFS /
    # CephFS clusters that only offer RWX should set this to
    # [ReadWriteMany].
    accessModes:
      - ReadWriteOnce

    # Labels merged onto every per-task PVC. Use for cost allocation,
    # backup operator selectors, data classification.
    labels: {}
    # cost-center: research-genomics
    # compliance/data-class: phi

    # Annotations merged onto every per-task PVC. Use for backup
    # operators (Velero/Kasten) and compliance tagging.
    annotations: {}
    # backup.velero.io/backup-volumes: task-data

    # ttlSecondsAfterFinished on the per-task Job (which GCs the PVC via
    # ownerReferences). null → field is omitted entirely, retaining the
    # Job and PVC until manually deleted (audit-retention deployments).
    retainAfterSeconds: 3600

  # What TOF does when an output glob (e.g. /outputs/*.vcf) matches no file.
  #   false → uploads nothing for that output and logs a warning.
  #   true  → uploads every file under the output's path_prefix instead, for
  #           clients whose patterns don't match the files they mean. This can
  #           export far more data than the client asked for.
  outputGlobFallback: false

  # Operator-supplied TaskPod extensions. Append to every per-task pod.
  #
  # env / volumes inject into poiesis-owned containers (trec / tif / tof).
  # volumeMounts additionally inject into executor containers because the
  # primary use case is read-only reference data that user code must see.
  #
  # Reserved names rejected at API startup:
  #   env:     DATABASE_URL, AWS_*, anything prefixed POIESIS_
  #   volume:  task-data, postgres-ca, tmp
  #
  # Total serialised JSON size is capped at ~32 KiB (Kubernetes env-var
  # limit). For typical extras this is plenty; very large extension sets
  # should use a mounted ConfigMap instead.
  extraEnv: []
  # - name: SENTRY_DSN
  #   value: https://...

  extraVolumes: []
  # - name: ref-grch38
  #   persistentVolumeClaim:
  #     claimName: ref-grch38-ro
  #     readOnly: true

  extraVolumeMounts: []
  # - name: ref-grch38
  #   mountPath: /ref/grch38
  #   readOnly: true

# -----------------------------------------------------------------------------
# NetworkPolicy
# -----------------------------------------------------------------------------

networkPolicy:
  enabled: false
  ingressFromPodSelector: {}
  extraEgress: []

# -----------------------------------------------------------------------------
# Migration hook (golang-migrate against the poiesis-migrations image)
# -----------------------------------------------------------------------------

migrations:
  image:
    registry: docker.io
    repository: jaeaeich/poiesis-migrations
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
