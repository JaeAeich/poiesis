# Default values for poiesis.
#
# Layered defaults:
#
#   Top level    → chart-wide settings every component inherits.
#   api: / tctl: → per-component overrides; only what differs from the top
#                  level. Image, security context, env, volumes, node
#                  scheduling all fall through to top-level when unset.
#   taskpods:    → workload-shape config baked into TaskPod manifests by
#                  the API at task-submit time. Distinct from the control
#                  plane: settings here affect what runs *for* a TES task,
#                  not the control plane itself.
#
# This chart NEVER creates Secrets for credentials. The operator must
# pre-create the database (and optional S3) Secret; the chart references
# it by name via existingSecret. values.schema.json enforces required keys.

# Name overrides. Empty values fall back to the chart's release name.
nameOverride: ""
fullnameOverride: ""

# Labels and annotations propagated to every resource the chart renders.
# Useful for cost allocation, multi-tenant cluster tagging, ownership audit.
commonLabels: {}
commonAnnotations: {}

# -----------------------------------------------------------------------------
# Chart-wide defaults (top level)
# -----------------------------------------------------------------------------

image:
  # registry + repository are kept separate so policy engines that scan for a
  # specific registry can match registry alone.
  registry: docker.io
  repository: jaeaeich/poiesis
  # Defaults to .Chart.AppVersion when empty so freshly-pulled charts pin to
  # their declared appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# imagePullSecrets propagate to api, tctl, migration hook, and every taskpod.
# Operators using IRSA / Workload Identity for runtime image pulls leave this
# empty.
imagePullSecrets: []
# - name: ghcr-pull-secret

# Pod-level securityContext applied to api, tctl, and the migration hook.
# Container-level lives under containerSecurityContext below.
# Both default to a profile derived from podSecurityEnforce (see below).
podSecurityContext: {}
containerSecurityContext: {}

# PodSecurity profile applied to poiesis-owned containers (api, tctl, hook,
# and per-TaskPod trec/tif/tof/ack). Executor containers in TaskPods run
# user-supplied images and follow taskpods.executorSecurityEnforce instead.
#
# Allowed: restricted | baseline | off.
podSecurityEnforce: restricted

# Default pod scheduling. Per-component overrides win when set.
nodeSelector: {}
tolerations: []
affinity: {}

# Extension points. Per-component extras APPEND to these — top-level wins
# nothing; component-level wins nothing; they coexist. Duplicate names will
# be rejected by Kubernetes admission. Operators must avoid collisions.
extraEnv: []
# - name: SENTRY_DSN
#   value: https://...

extraEnvFrom: []
# - secretRef:
#     name: observability-tokens

extraVolumes: []
# - name: shared-ca
#   configMap:
#     name: corp-ca-bundle

extraVolumeMounts: []
# - name: shared-ca
#   mountPath: /etc/ssl/corp
#   readOnly: true

# Arbitrary manifests rendered verbatim by the chart. Trapdoor for everything
# the chart doesn't model: NetworkAttachmentDefinitions, custom CRs, sealed
# secrets, etc. Each entry is a string or template rendering to one or more
# YAML docs.
extraManifests: []
# - |
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: extra-config
#   data:
#     key: value

# Service accounts. Per-component create=true mints a chart-managed SA; set
# create=false and name=<existing> to bind an out-of-band SA (typical for
# IRSA / Workload Identity).
serviceAccount:
  api:
    create: true
    name: ""
    annotations: {}
  tctl:
    create: true
    name: ""
    annotations: {}
  # For object-store access set s3.roleArn, azure.clientId or
  # gcs.workloadIdentityProvider instead of cloud-identity annotations
  # here: the EKS/AKS webhooks and the GKE metadata server would give
  # credentials to every container of the TaskPod, executors included.
  taskpod:
    create: true
    name: ""
    annotations: {}

# Logging.
logLevel: INFO
logging:
  # Log line format of the API, TCtl and the TaskPod's trec, tif and tof:
  # `json` (one object per line), `text` (coloured, for a terminal), or
  # "" to choose by whether stderr is a terminal. The audit log ignores it.
  format: json

# -----------------------------------------------------------------------------
# External dependencies (operator-supplied; chart does NOT create these)
# -----------------------------------------------------------------------------

# Postgres connection. The Secret must hold a full DATABASE_URL of the form:
#   postgresql://USER:PASS@HOST:PORT/DB?sslmode=verify-full&sslrootcert=/etc/ssl/poiesis/ca.crt
database:
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  # ConfigMap (key: ca.crt) mounted read-only at /etc/ssl/poiesis on api,
  # tctl, and every taskpod's poiesis-owned container. Empty disables.
  caConfigmap: ""
  # Connection pool of each API replica. Postgres sees up to
  # api.replicas (or autoscaling.maxReplicas) x maxSize connections from
  # the API; size it against max_connections (see guides/production).
  pool:
    minSize: 1
    maxSize: 10
    # Seconds a request waits for a free connection before it gets a 503.
    acquireTimeoutSeconds: 10
  # Seconds a database statement of the API or tctl may run before it fails.
  # Also bounds a hung connection.
  commandTimeoutSeconds: 30

# Resource-server auth. Poiesis validates incoming JWTs itself, against the
# keys of the issuers listed here; a token's `iss` picks its issuer (exact
# match). When `enabled: true` (default) at least one issuer is REQUIRED —
# the schema rejects an empty list at `helm install` time. When
# `enabled: false` the API accepts every request as a fixed anonymous
# principal; intended for local dev and air-gapped single-tenant
# deployments only. Rendered as POIESIS_AUTH_ISSUERS (JSON).
auth:
  enabled: true
  # One entry per trusted issuer. Keys per entry:
  #   issuer          REQUIRED. Exact `iss` of the tokens, e.g.
  #                   https://keycloak.example.org/realms/poiesis. Also the
  #                   OIDC discovery base URL; the discovery document's
  #                   `issuer` must equal it exactly.
  #   audience        REQUIRED. Accepted `aud` claim: a string, or a list
  #                   of which the token's `aud` must hold one. Use one
  #                   value per Poiesis instance; several only during a
  #                   migration (e.g. shared -> per-instance audience).
  #   tokenTypes      Accepted JWT header `typ` values, compared without
  #                   case, `application/` optional (default [at+jwt],
  #                   RFC 9068 access tokens), so that ID tokens and other
  #                   JWTs of the issuer are refused. Keycloak access
  #                   tokens carry `JWT` by default: list [JWT]. [] turns
  #                   the check off (weaker: any JWT of the issuer with
  #                   the audience passes).
  #   clients         OAuth clients (token `azp`, else `client_id`) whose
  #                   tokens are accepted; tokens of other clients, or
  #                   without one, get 401. Unset: any client.
  #   namespace       Prefix of the owner id stamped on tasks and keys:
  #                   `<namespace>|<subject>` (default: the issuer). No
  #                   `|`. When an issuer's URL changes, give the new
  #                   entry the old URL as namespace so owners stay the
  #                   same (a startup WARNING names issuers sharing one).
  #   principalClaim  Claim naming the subject (default `sub`). Dotted
  #                   paths walk nested objects (`ctx.group_id`).
  #   requiredScopes  Scopes a token MUST carry (default none).
  #   requiredClaim   Admission rule for this issuer's tokens (and keys
  #                   minted with them): {name, values, prefixes}. The
  #                   claim `name` (exact name first, then a dotted path;
  #                   token first, then userinfo) must be a string or
  #                   list of strings holding one of `values` or
  #                   starting with one of `prefixes`, else 403. Prefixes
  #                   are raw: include the delimiter (`urn:...:vo:`).
  #                   Never applies to other issuers' tokens. Unset: all
  #                   of the issuer's tokens are admitted.
  #   admin           Built-in admin rule for this issuer's tokens:
  #                   {name, values, prefixes}, matched like requiredClaim.
  #                   Applies only without a decision service (with one,
  #                   admin is its policy and this is ignored, with a
  #                   startup WARNING). Admins may list and revoke any
  #                   owner's API keys (offboarding), and with
  #                   authz.adminRead also list, get and cancel every
  #                   task. Never applies to delegated tokens.
  #   actors          Actors (RFC 8693 `act.sub`, e.g. a gateway's client
  #                   id) whose delegated tokens of this issuer the
  #                   built-in policy accepts when there is no decision
  #                   service; other delegated tokens get 403.
  #   userinfo        {enabled: true} fetches the issuer's userinfo per
  #                   token (cached until it expires, at most 5 minutes)
  #                   for claims missing from access tokens (default off).
  #   jwksUri         Static JWKS URL; skips discovery. For gateways
  #                   (Envoy, Istio, oauth2-proxy) that sign their own
  #                   JWTs. Can't be combined with userinfo.
  #   jwksCacheTtl    Seconds to cache the keys (default 3600). Unknown
  #                   `kid`s refetch them anyway, at most every 30 s.
  #   clockSkew       Seconds of leeway on exp/nbf/iat (default 30).
  #   timeout         Seconds per call to the issuer (default 10).
  #   keyMinting      Which of its tokens may mint API keys; without it,
  #                   none may. {clients: [...]} lists the OAuth clients
  #                   (token `azp`, else `client_id`) allowed, normally
  #                   the interactive login client, not service accounts.
  #                   maxAuthAge (seconds) also requires a recent login
  #                   (`auth_time` in the access token).
  # Example:
  #   issuers:
  #     - issuer: https://keycloak.example.org/realms/poiesis
  #       audience: poiesis
  #       tokenTypes: [JWT]
  #       clients: [poiesis-cli, portal]
  #       requiredClaim: {name: groups, values: [/poiesis-users]}
  #       admin: {name: groups, values: [/poiesis-admins]}
  #       keyMinting: {clients: [poiesis-cli], maxAuthAge: 600}
  #     - issuer: https://gateway.example.org
  #       audience: poiesis
  #       jwksUri: http://gateway.mesh.svc/.well-known/jwks.json
  issuers: []
  # Public URL of this Poiesis, e.g. https://poiesis.example.org (no
  # query, fragment or credentials; a trailing / is dropped). Clients
  # discover how to authenticate from it: Poiesis serves OAuth 2.0
  # Protected Resource Metadata (RFC 9728) at
  # <origin>/.well-known/oauth-protected-resource<path>, listing the
  # issuers above, and every 401 points there in WWW-Authenticate. With
  # a path (https://example.org/poiesis), route that well-known URL to
  # the API too. Empty: no metadata; 401s carry a plain Bearer challenge.
  resource: ""
  # Poiesis API keys (`poi_...`) for clients that outlive an access token,
  # such as workflow engines. Owners mint them at POST /poiesis/v1/api-keys
  # with an OIDC token; see the "API keys" docs page. Off by default: an
  # add-on for clients that can't refresh tokens.
  apiKeys:
    enabled: false
    # Lifetime when the minting request names none, and the most it may
    # ask for: `<n>d` or `<n>h`. A key's claims are a snapshot from
    # minting, so changes at the IdP reach it only when it expires.
    defaultTtl: 7d
    maxTtl: 90d
    # Active (not revoked, not expired) keys an owner may hold.
    maxPerOwner: 20
  # Login offered by the Swagger UI at /docs (authorization code + PKCE),
  # so owners can mint keys from the browser. Documentation only: tokens
  # are validated as usual. Empty `issuer` turns it off.
  swaggerUi:
    # One of `issuers` above (exact match), with OIDC discovery.
    issuer: ""
    # Public client of that issuer that allows the redirect URI
    # <API URL>/docs/oauth2-redirect and the API's origin.
    clientId: ""
    # Space-separated scopes requested.
    scopes: openid

# Authorization (see the "Authorization" docs page). Off by default; when
# both an issuer's requiredClaim (above) and the decision service are set,
# both must allow. Needs auth.enabled. The former global
# `authz.requiredClaim` is refused: set it per issuer instead.
authz:
  # External decision service: an OpenID AuthZEN 1.0 Access Evaluation
  # endpoint asked once per decision. Empty `url` keeps the built-in
  # owner rule. Any failure or timeout is a 503.
  decisionService:
    # Full evaluation URL, e.g. http://localhost:8181/access/v1/evaluation
    url: ""
    # Seconds per evaluation.
    timeout: 2
    # Claims sent to the service in subject.properties.claims.
    claims: []
    # Optional path (in the API pod) of a file with a bearer credential
    # for the service; mount it from a Secret via extraVolumes and
    # extraVolumeMounts.
    credentialFile: ""
  # Let the decision service show tasks to others than their owner: list
  # `all`, a list `scope` (owners, groups, tags), others' tasks on get and
  # cancel, and `groups` set on create. Off: every task is visible to its
  # owner only, whatever the service answers. Needs decisionService.url.
  sharing: false
  # Most owners one list scope may name; a scope with more is denied (403)
  # and logged, so a runaway policy can't build an unbounded query.
  maxOwners: 1000
  # Give the built-in admins (auth.issuers[].admin, no decision service)
  # read and cancel of every task: list all, get and cancel any. Off: an
  # admin sees their own tasks only, as everyone does; task data
  # (inputs, outputs, logs, environment) is often granted to one person.
  # Revoking and listing others' API keys needs no adminRead.
  adminRead: false

# Audit log: one JSON object per line on the API's stdout (logger
# `poiesis.audit`) for every task authorization outcome and API key event,
# whatever logLevel says. Never tokens, keys or claim values. Retention is
# your log pipeline's.
audit:
  enabled: true

# GA4GH service info (GET /service-info): how registries and clients tell
# this deployment apart. Empty keeps the built-in value; `environment` is
# then left out and `createdAt` is the time of the request. `version` is
# always the Poiesis version, `type.version` the TES version. Invalid
# values stop the API from starting.
serviceInfo:
  # Unique id of this deployment, reverse domain name recommended, e.g.
  # org.example.tes.prod. Also sent to the decision service as
  # context.tes.service_id. Built-in: org.ga4gh.poiesis.
  id: ""
  # Human-readable name and description.
  name: ""
  description: ""
  # Who runs this deployment; `url` is an http(s) URL.
  organization:
    name: ""
    url: ""
  # http(s) URL of a contact form, or mailto:<address>.
  contactUrl: ""
  # http(s) URL of the documentation for this deployment's users.
  documentationUrl: ""
  # E.g. prod, test, dev or staging.
  environment: ""
  # When first deployed: ISO 8601 with a UTC offset, e.g.
  # 2026-01-15T09:00:00Z.
  createdAt: ""

# S3-compatible storage. Optional: required only when task inputs/outputs
# reference s3:// URLs.
# Object stores tif and tof stage inputs from and upload outputs to. A
# provider's scheme (s3://, gs://, az://) is accepted at submit and listed
# in service-info only when the provider is on. See the Storage docs page.
s3:
  # Offer s3:// without static keys: tif/tof assume `roleArn` below, or use
  # the node's instance credentials (IMDS). Setting existingSecret or
  # roleArn also turns S3 on.
  enabled: false
  # Non-secret. AWS_ENDPOINT_URL — empty for real AWS S3.
  endpoint: ""
  # AWS_REGION.
  region: ""
  # Existing Secret with AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY, and
  # AWS_SESSION_TOKEN for temporary credentials. Empty when using workload
  # identity or instance credentials.
  existingSecret: ""
  # IAM role tif/tof assume with a ServiceAccount token for
  # sts.amazonaws.com (IRSA). The token is mounted into tif and tof only,
  # never into executors. Don't also annotate the TaskPod ServiceAccount
  # with eks.amazonaws.com/role-arn: the EKS webhook would give the token
  # to every container, executors included.
  roleArn: ""
  # Virtual-hosted-style requests (https://<bucket>.<endpoint>/<key>).
  # false: path-style (https://<endpoint>/<bucket>/<key>), which
  # S3-compatible stores such as SeaweedFS and MinIO need.
  virtualHostedStyle: false
  # Server-side encryption of uploads: "", AES256 (SSE-S3), aws:kms
  # (SSE-KMS) or aws:kms:dsse.
  serverSideEncryption: ""
  # KMS key for aws:kms / aws:kms:dsse; empty uses the bucket's default key.
  kmsKeyId: ""
  # Send x-amz-request-payer: requester, for requester-pays buckets.
  requesterPays: false
  # Unsigned requests, for public buckets: no credentials. Turns S3 on;
  # leave existingSecret and roleArn empty.
  anonymous: false

# Google Cloud Storage (gs://). Needs existingSecret or
# workloadIdentityProvider: without either, tif/tof would use the node's
# metadata server, which executors reach too.
gcs:
  enabled: false
  # Secret in the TaskPod namespace with key GOOGLE_SERVICE_ACCOUNT_KEY
  # (the service account's JSON key).
  existingSecret: ""
  # Workload Identity Federation: the pool provider's full name,
  # //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>.
  # tif/tof get a ServiceAccount token for https:<that name>, mounted into
  # tif and tof only, and trade it at Google STS. Leave existingSecret
  # empty.
  workloadIdentityProvider: ""
  # Service account to impersonate with the federated token; empty uses
  # the federated principal directly.
  serviceAccount: ""
  # Base URL of the GCS API; empty for https://storage.googleapis.com.
  # For Private Service Connect, a sovereign cloud or an emulator.
  endpoint: ""
  # Unsigned requests, for public buckets, in place of existingSecret or
  # workloadIdentityProvider.
  anonymous: false

# Azure Blob Storage (az://container/blob).
azure:
  enabled: false
  # Storage account the containers belong to. Required when enabled.
  accountName: ""
  # Secret in the TaskPod namespace with key AZURE_STORAGE_ACCOUNT_KEY or
  # AZURE_STORAGE_SAS_TOKEN. Empty when using workload identity.
  existingSecret: ""
  # Workload identity: the managed identity's client ID and its tenant.
  # tif/tof get a ServiceAccount token for api://AzureADTokenExchange,
  # mounted into tif and tof only. Set both or neither.
  clientId: ""
  tenantId: ""
  # Blob endpoint; empty for https://<accountName>.blob.core.windows.net.
  # For a private endpoint, a sovereign cloud, Azure Stack or Azurite
  # (http://azurite:10000/<account>).
  endpoint: ""
  # Unsigned requests, for public containers: no existingSecret or clientId.
  anonymous: false

# Named object stores, next to the default ones above: each serves the
# buckets (containers, for Azure) its `buckets` patterns match, with its
# own endpoint and credentials. A pattern is a bucket name or a prefix
# ending in `*`. A URL goes to the named store of its provider whose
# patterns match its bucket, else to that provider's default store (s3,
# gcs, azure above) when it is on, else submit refuses it. Patterns of two
# stores of one provider may not overlap; the API refuses to start.
# Options are those of the provider's default block, minus `enabled`;
# existingSecret is a Secret in the TaskPod namespace with the same keys.
# Credentials reach tif and tof only.
objectStores: []
#  - name: aws-open-data        # lower case, digits, '-'; at most 40
#    provider: s3               # s3 | gcs | azure
#    buckets: ["1000genomes", "gnomad-public-*"]
#    region: us-east-1
#    anonymous: true
#  - name: ceph
#    provider: s3
#    buckets: ["lab-*"]
#    endpoint: https://ceph.example.org
#    existingSecret: poiesis-ceph   # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#  - name: archive
#    provider: azure
#    buckets: ["archive"]
#    accountName: labarchive
#    clientId: 00000000-0000-0000-0000-000000000000
#    tenantId: 00000000-0000-0000-0000-000000000000

# -----------------------------------------------------------------------------
# API (TES HTTP endpoint)
# -----------------------------------------------------------------------------

api:
  replicas: 1

  # Image override (falls back to top-level image). Useful for canarying.
  image: {}
  # registry: ""
  # repository: ""
  # tag: ""
  # pullPolicy: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  probes:
    startup:
      enabled: true
      periodSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  # Shutdown. The preStop sleep runs first, so Services and ingresses stop
  # sending new requests before the API gets SIGTERM; gunicorn then lets
  # running requests finish for up to 30 s (its graceful timeout). The grace
  # period covers both: keep it >= preStopSleepSeconds + 30, or Kubernetes
  # kills requests still running. preStopSleepSeconds: 0 → no preStop hook.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 40

  # Pod topologySpreadConstraints, e.g. one replica per zone:
  #   - maxSkew: 1
  #     topologyKey: topology.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway
  # An entry without labelSelector gets the API Pods' selector labels.
  topologySpreadConstraints: []

  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: poiesis.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  pdb:
    enabled: false
    minAvailable: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  # Component-local extensions. Append to the chart-wide extras.
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# TCtl (sole writer of terminal task state)
# -----------------------------------------------------------------------------

tctl:
  # Leader election means only one replica is active at a time. Increasing
  # this gives faster failover, not throughput. There is no tctl
  # PodDisruptionBudget: with one replica it would block node drains, and an
  # evicted tctl only delays task state updates until a replica holds the
  # lease again.
  replicas: 1

  # How long a task may wait, in seconds, for its Pod to be created and
  # scheduled (ResourceQuota full, no node with room) before tctl ends it as
  # SYSTEM_ERROR with the scheduler's message and deletes its Job.
  # null → no limit: the task stays QUEUED until the Job's time limit
  # (taskpods.activeDeadlineSeconds) ends it. On a busy cluster waiting is
  # normal queueing; set this only to fail fast. Integer >= 1.
  # A Pod already bound to a node that doesn't start (image pull) always
  # fails after 5 minutes.
  unschedulableTimeoutSeconds: null

  probes:
    # tctl touches /tmp/poiesis-tctl-heartbeat after each loop iteration,
    # leader or standby. The probe fails when the file is older than
    # maxHeartbeatAgeSeconds: a pass that hangs gets tctl restarted. Keep
    # it above your longest pass; one with many log reads against a slow
    # API server can take minutes.
    liveness:
      enabled: true
      maxHeartbeatAgeSeconds: 600
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  image: {}

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# TaskPod workload-shape config
#
# Settings here are baked into the TaskPod manifests the API builds at
# submit time. They affect what runs FOR a TES task, not the control plane.
# -----------------------------------------------------------------------------

taskpods:
  # Namespace TaskPods land in. Empty means same as release namespace.
  # When split, the chart renders the API + taskpod Roles in this namespace.
  namespace: ""

  # Secrets that trec, tif and tof read DATABASE_URL and the S3 keys from.
  # A Pod can only read Secrets in its own namespace: when `namespace` above
  # differs from the release namespace, create these Secrets there too. The
  # chart does not copy them. Empty means the same name as
  # database.existingSecret / s3.existingSecret; the keys are the same.
  databaseSecret: ""
  s3Secret: ""

  persistence:
    # Default size when a TES request omits resources.disk_gb.
    defaultSizeGi: 10

    # Hard upper bound on resources.disk_gb. The API rejects submissions
    # over this with HTTP 400 before any pod is created. Production MUST
    # set this; the schema fails install if it's missing.
    maxSizeGi: 100

    # StorageClass for per-task PVCs. Three states:
    #   ""    → omit storageClassName; cluster default applies
    #   "-"   → set storageClassName: "" (disables dynamic provisioning,
    #           requires a pre-bound PV; matches kubectl convention)
    #   other → use that named StorageClass
    storageClass: ""

    # PVC access modes applied to every task. Cluster property: in this
    # architecture a task runs on one node, so RWO is sufficient. NFS /
    # CephFS clusters that only offer RWX should set this to
    # [ReadWriteMany].
    accessModes:
      - ReadWriteOnce

    # Labels merged onto every per-task PVC. Use for cost allocation,
    # backup operator selectors, data classification.
    labels: {}
    # cost-center: research-genomics
    # compliance/data-class: phi

    # Annotations merged onto every per-task PVC. Use for backup
    # operators (Velero/Kasten) and compliance tagging.
    annotations: {}
    # backup.velero.io/backup-volumes: task-data

    # ttlSecondsAfterFinished on the per-task Job (which GCs the PVC via
    # ownerReferences). null → field is omitted entirely, retaining the
    # Job and PVC until manually deleted (audit-retention deployments).
    retainAfterSeconds: 3600

  # Time limit of a task, in seconds: activeDeadlineSeconds on the per-task
  # Job, counted from the Job's creation, so time spent waiting for a node
  # or pulling images counts. Kubernetes stops a task that runs longer and
  # the task fails. Integer >= 1.
  # null → no limit. A task whose Pod can't be scheduled then waits for as
  # long as it takes, unless tctl.unschedulableTimeoutSeconds is set.
  activeDeadlineSeconds: 3600

  # What TOF does when an output glob (e.g. /outputs/*.vcf) matches no file.
  #   false → uploads nothing for that output and logs a warning.
  #   true  → uploads every file under the output's path_prefix instead, for
  #           clients whose patterns don't match the files they mean. This can
  #           export far more data than the client asked for.
  outputGlobFallback: false

  # Directories that file:// input and output URLs may point into. Empty
  # (the default) turns the file:// scheme off: tasks using it get a 400.
  # A file:// URL is resolved inside the TIF/TOF containers, so list only
  # directories you mount there through extraVolumes / extraVolumeMounts,
  # e.g. ["/mnt/reference"]. Never list a path that holds credentials.
  fileUrlRoots: []

  # ftp:// and ftps:// (explicit TLS) inputs and outputs. On by default, like
  # http(s): public archives (EBI, ENA, NCBI) need no credentials, and a URL
  # with no user logs in as anonymous. A URL may carry user:password@; it is
  # stored with the task like the rest of the URL, and left out of logs.
  # false refuses ftp:// and ftps:// URLs with a 400.
  ftp:
    enabled: true

  # GA4GH DRS inputs: drs://<host>/<object_id> (hostname-based DRS 1.x URIs).
  # TIF asks https://<host>/ga4gh/drs/v1 for the object's access URL and
  # stages it over https, an enabled object store, ftp or http. Off by
  # default: tasks using drs:// get a 400.
  drs:
    enabled: false
    # DRS hosts tasks may name, e.g. ["drs.example.org"]. Empty, with
    # enabled: true, allows any host.
    allowedHosts: []
    # Secret in the TaskPod namespace with key DRS_BEARER_TOKEN. TIF sends it
    # as a bearer token to DRS servers, and never to the data URL. Executors
    # don't get it. Empty sends no token.
    existingSecret: ""

  # Pod Security profile of the executor containers (user images) and of the
  # TaskPod's Pod-level securityContext. A namespace that enforces Pod
  # Security `restricted` refuses every TaskPod unless this is `restricted`.
  #   off        → no securityContext: executors run as their images say,
  #                root included (the default).
  #   baseline   → executors: allowPrivilegeEscalation false, drop ALL
  #                capabilities.
  #   restricted → baseline, plus runAsNonRoot and seccomp RuntimeDefault on
  #                executors, and on the Pod runAsUser/runAsGroup/fsGroup
  #                65532 (the poiesis image's user) with fsGroupChangePolicy
  #                OnRootMismatch. Every container then runs as uid 65532, so
  #                images that need root, or a user of their own, fail.
  # On OpenShift, keep `off`: its SecurityContextConstraints assign users.
  # Quote "off": unquoted, YAML reads it as false and the schema refuses it.
  executorSecurityEnforce: "off"
  # Pod-level securityContext keys merged over the profile (keys you set
  # replace the profile's), e.g. {runAsUser: 1000, runAsGroup: 1000,
  # fsGroup: 1000} for another fixed user. Applies to every TaskPod
  # container, trec/tif/tof/ack included.
  podSecurityContext: {}
  # securityContext keys of every executor container, merged over the
  # profile the same way, e.g. {readOnlyRootFilesystem: true}. Keys of both
  # are checked at API startup: an unknown one stops the API.
  executorSecurityContext: {}

  # Requests and limits of the poiesis-owned TaskPod containers. Needed when
  # the TaskPod namespace has a ResourceQuota on cpu or memory and no
  # LimitRange: Kubernetes then rejects Pods with containers that set none.
  # Executors get theirs from the task's TES `resources` (see `resources`
  # below). Your values merge
  # with these defaults key by key; null (e.g. `ack: null`) leaves that
  # container without requests or limits. Invalid values stop the API at
  # startup.
  systemResources:
    # trec: sidecar for the whole task; watches the Pod and writes state
    # and logs to Postgres. Mostly idle.
    recorder:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # tif and tof: stage inputs and outputs. Transfers are streamed (HTTP in
    # 8 KiB chunks, S3 through boto3's multipart transfers of about 80 MiB in
    # flight), so memory doesn't grow with file size; the limit leaves room
    # for that and the Python process. Raise cpu for faster large transfers.
    filer:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    # ack: last container; records that the task ended and exits.
    ack:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

  # Requests and limits of the executor containers, from the task's TES
  # resources.cpu_cores and ram_gb. Memory: request = limit = ram_gb (read
  # as GiB). CPU: request = cpu_cores, and the same limit unless cpuLimit is
  # false. Executors run one after another, so each gets the full amount and
  # Kubernetes schedules the Pod on that, not on the sum.
  resources:
    # Used when a task sets no cpu_cores / ram_gb. null: no request or limit
    # (the executor may use what the node has).
    defaultCpuCores: null
    defaultRamGb: null
    # A task asking for more gets HTTP 400 at submit. null: no maximum.
    maxCpuCores: null
    maxRamGb: null
    # false sets CPU requests only, for clusters that avoid CPU limits
    # (throttling). Memory always gets a limit.
    cpuLimit: true

  # Scheduling of every TaskPod. Unrelated to the top-level nodeSelector /
  # tolerations / affinity, which place the API and tctl. imagePullSecrets
  # (top level) already reach TaskPods.
  nodeSelector: {}
  tolerations: []
  # A task's TES zones are added to affinity as a required node affinity on
  # topology.kubernetes.io/zone, added to each of your required terms.
  affinity: {}
  priorityClassName: ""
  runtimeClassName: ""

  # Node selector and tolerations added for tasks with TES preemptible: true,
  # e.g. {nodeSelector: {cloud.google.com/gke-spot: "true"}, tolerations: [...]}.
  # Empty: preemptible is ignored (TES lets a backend do that).
  preemptible:
    nodeSelector: {}
    tolerations: []

  # GPUs a task asks for with backend_parameters.gpu_count: a limit of that
  # many on this resource, on each executor. A task over maxCount gets a 400.
  gpu:
    resourceName: nvidia.com/gpu
    maxCount: null

  # TES backend_parameters honoured. Keys not listed are ignored, or a 400
  # under backend_parameters_strict. They are listed in GET /service-info
  # (tesResources_backend_parameters). Known keys:
  #   gpu_count       whole number of GPUs (see gpu above)
  #   priority_class  one of priorityClasses below; overrides priorityClassName
  #   node_pool       a key of nodePools below; adds its nodeSelector and
  #                   tolerations
  backendParameters:
    allowed: []
    priorityClasses: []
    nodePools: {}
    # highmem:
    #   nodeSelector: {pool: highmem}
    #   tolerations:
    #     - {key: highmem, operator: Exists, effect: NoSchedule}

  # Operator-supplied TaskPod extensions. Append to every per-task pod.
  #
  # env / volumes inject into poiesis-owned containers (trec / tif / tof).
  # volumeMounts additionally inject into executor containers because the
  # primary use case is read-only reference data that user code must see.
  #
  # Reserved names rejected at API startup:
  #   env:     DATABASE_URL, AWS_*, anything prefixed POIESIS_
  #   volume:  task-data, postgres-ca, tmp
  #
  # Total serialised JSON size is capped at ~32 KiB (Kubernetes env-var
  # limit). For typical extras this is plenty; very large extension sets
  # should use a mounted ConfigMap instead.
  extraEnv: []
  # - name: SENTRY_DSN
  #   value: https://...

  extraVolumes: []
  # - name: ref-grch38
  #   persistentVolumeClaim:
  #     claimName: ref-grch38-ro
  #     readOnly: true

  extraVolumeMounts: []
  # - name: ref-grch38
  #   mountPath: /ref/grch38
  #   readOnly: true

# -----------------------------------------------------------------------------
# Metrics (Prometheus)
# -----------------------------------------------------------------------------

# The API and tctl serve Prometheus metrics at /metrics on `port`, apart
# from the TES API's port: not through the Ingress, no auth, not in the
# access log. Labels are bounded: no task, user or owner labels. See the
# monitoring guide for the metrics, a dashboard and alert rules.
metrics:
  enabled: true
  port: 9090
  # prometheus.io/scrape, /port and /path annotations on the API and tctl
  # Pods, for a Prometheus that discovers Pods by annotation.
  scrapeAnnotations: false
  service:
    # Annotations of the two metrics Services (<release>-api-metrics and
    # <release>-tctl-metrics).
    annotations: {}
  # A prometheus-operator ServiceMonitor for both Services. Needs the
  # monitoring.coreos.com CRDs.
  serviceMonitor:
    enabled: false
    # Labels your Prometheus selects ServiceMonitors by, e.g.
    # {release: kube-prometheus-stack}.
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
  # A ConfigMap holding the Grafana dashboard (dashboards/poiesis.json),
  # for the Grafana sidecar that loads ConfigMaps labelled as below.
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

# -----------------------------------------------------------------------------
# NetworkPolicy
# -----------------------------------------------------------------------------

# Policies for the API and tctl Pods (not the migration hook, not TaskPods).
# Both may reach DNS, any address on TCP 443 and 6443 (Kubernetes API, S3,
# issuers) and Postgres (databaseEgress). The API accepts traffic on 8000
# from this release's Pods and from the peers listed below only; the API and
# tctl accept metrics.port from metricsFrom.
networkPolicy:
  enabled: false
  # Postgres. Empty `to` allows the port to any address, which is what
  # makes a default install work; narrow it with NetworkPolicy peers, e.g.
  #   to:
  #     - ipBlock: {cidr: 10.0.12.0/24}
  #     - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: db}}
  #       podSelector: {matchLabels: {app: postgres}}
  # null turns the rule off (then allow Postgres through extraEgress).
  databaseEgress:
    port: 5432
    to: []
  # Extra NetworkPolicy peers allowed to reach the API on 8000, e.g. the
  # ingress controller in another namespace:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  ingressFrom: []
  # Labels of other Pods in the release namespace allowed to reach the API.
  ingressFromPodSelector: {}
  # NetworkPolicy peers allowed to scrape metrics.port on the API and
  # tctl, e.g. the Prometheus namespace:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: monitoring}
  # Empty allows the port from any address.
  metricsFrom: []
  # Extra NetworkPolicy egress rules for the API and tctl, e.g. an issuer
  # or S3 endpoint on a port other than 443:
  #   - to: [{ipBlock: {cidr: 192.0.2.10/32}}]
  #     ports: [{protocol: TCP, port: 9000}]
  extraEgress: []

# -----------------------------------------------------------------------------
# Migration hook (golang-migrate against the poiesis-migrations image)
# -----------------------------------------------------------------------------

migrations:
  image:
    registry: docker.io
    repository: jaeaeich/poiesis-migrations
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
