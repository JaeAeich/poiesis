{{/*
TaskPod SA: trec reads its own pod via the K8s API. No writes.
*/}}
{{- $tpNs := include "poiesis.taskpodNamespace" . -}}
{{- $taskpodSA := include "poiesis.serviceAccountName" (dict "role" "taskpod" "root" .) -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poiesis.fullname" . }}-taskpod
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "taskpod" "root" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poiesis.fullname" . }}-taskpod
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "taskpod" "root" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $taskpodSA }}
    namespace: {{ $tpNs }}
roleRef:
  kind: Role
  name: {{ include "poiesis.fullname" . }}-taskpod
  apiGroup: rbac.authorization.k8s.io
