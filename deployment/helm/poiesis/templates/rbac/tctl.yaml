{{/*
TCtl: leases for leader election in the release namespace, pod read in the
taskpod namespace for the reconcile loop. No deletes, no writes — tctl
only writes to Postgres, never to Kubernetes.
*/}}
{{- $tpNs := include "poiesis.taskpodNamespace" . -}}
{{- $relNs := .Release.Namespace -}}
{{- $tctlSA := include "poiesis.serviceAccountName" (dict "role" "tctl" "root" .) -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl
  namespace: {{ $relNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl
  namespace: {{ $relNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $tctlSA }}
    namespace: {{ $relNs }}
roleRef:
  kind: Role
  name: {{ include "poiesis.fullname" . }}-tctl
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl-pods
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl-pods
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $tctlSA }}
    namespace: {{ $relNs }}
roleRef:
  kind: Role
  name: {{ include "poiesis.fullname" . }}-tctl-pods
  apiGroup: rbac.authorization.k8s.io
