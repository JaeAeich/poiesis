{{/*
API submits + (on cancel) deletes Jobs; creates PVCs with an ownerReference
back to the Job so kube-controller-manager handles PVC garbage collection.
RBAC is namespaced to the taskpod namespace (potentially different from
release namespace).
*/}}
{{- $tpNs := include "poiesis.taskpodNamespace" . -}}
{{- $apiSA := include "poiesis.serviceAccountName" (dict "role" "api" "root" .) -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "poiesis.fullname" . }}-api
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "poiesis.fullname" . }}-api
  namespace: {{ $tpNs }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $apiSA }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "poiesis.fullname" . }}-api
  apiGroup: rbac.authorization.k8s.io
