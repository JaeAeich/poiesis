{{- range $role := list "api" "tctl" "taskpod" }}
{{- $sa := index $.Values.serviceAccount $role }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "poiesis.serviceAccountName" (dict "role" $role "root" $) }}
  namespace: {{ if eq $role "taskpod" }}{{ include "poiesis.taskpodNamespace" $ }}{{ else }}{{ $.Release.Namespace }}{{ end }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" $role "root" $) | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
