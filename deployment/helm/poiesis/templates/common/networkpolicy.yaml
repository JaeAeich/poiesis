{{- /* Egress shared by the API and tctl: DNS, HTTPS / the Kubernetes API, Postgres. */}}
{{- define "poiesis.networkPolicy.egress" -}}
- to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
{{- /* No `to`: `namespaceSelector: {}` matches Pods only, and the Kubernetes
  API server, S3 and issuers are usually not Pods. */}}
- ports:
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 6443 }
{{- with .Values.networkPolicy.databaseEgress }}
- ports:
    - { protocol: TCP, port: {{ .port | int }} }
  {{- with .to }}
  to: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- with .Values.networkPolicy.extraEgress }}
{{ toYaml . }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poiesis.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poiesis.componentSelectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "poiesis.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.ingressFromPodSelector }}
        - podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    {{- include "poiesis.networkPolicy.egress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poiesis.componentSelectorLabels" (dict "component" "tctl" "root" .) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- include "poiesis.networkPolicy.egress" . | nindent 4 }}
{{- end }}
