{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poiesis.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poiesis.componentSelectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "poiesis.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.ingressFromPodSelector }}
        - podSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poiesis.fullname" . }}-tctl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.componentLabels" (dict "component" "tctl" "root" .) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "poiesis.componentSelectorLabels" (dict "component" "tctl" "root" .) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
