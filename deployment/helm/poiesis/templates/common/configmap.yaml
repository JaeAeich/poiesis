{{/*
Non-secret runtime env for api + tctl. The taskpod image gets baked in
here so submitted tasks always pull the same tag the control plane runs.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poiesis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.labels" . | nindent 4 }}
  {{- with include "poiesis.commonAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  POIESIS_NAMESPACE: {{ .Release.Namespace | quote }}
  POIESIS_TASKPOD_NAMESPACE: {{ include "poiesis.taskpodNamespace" . | quote }}
  POIESIS_IMAGE: {{ include "poiesis.image" (dict "component" .Values.api "root" .) | quote }}
  POIESIS_TASKPOD_SERVICE_ACCOUNT: {{ include "poiesis.serviceAccountName" (dict "role" "taskpod" "root" .) | quote }}
  POIESIS_POD_SECURITY_ENFORCE: {{ .Values.podSecurityEnforce | quote }}
  {{- with .Values.imagePullSecrets }}
  POIESIS_IMAGE_PULL_SECRETS: {{ join "," (pluck "name" .) | quote }}
  {{- end }}
  {{- with .Values.database.caConfigmap }}
  POIESIS_POSTGRES_CA_CONFIGMAP: {{ . | quote }}
  {{- end }}

  # ---- Per-task PVC contract -------------------------------------------------
  # storageClass: the kubectl "-" sentinel for "no provisioning" maps to the
  # empty string so the runtime sets storageClassName: "" on the PVC. Unset
  # passes through as unset.
  {{- $sc := .Values.taskpods.persistence.storageClass }}
  {{- if ne $sc "" }}
  POIESIS_PVC_STORAGE_CLASS: {{ ternary "" $sc (eq $sc "-") | quote }}
  {{- end }}
  POIESIS_PVC_DEFAULT_SIZE_GI: {{ .Values.taskpods.persistence.defaultSizeGi | quote }}
  POIESIS_PVC_MAX_SIZE_GI: {{ .Values.taskpods.persistence.maxSizeGi | quote }}
  POIESIS_PVC_ACCESS_MODES: {{ join "," .Values.taskpods.persistence.accessModes | quote }}
  {{- with .Values.taskpods.persistence.labels }}
  POIESIS_PVC_LABELS: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.persistence.annotations }}
  POIESIS_PVC_ANNOTATIONS: {{ toJson . | quote }}
  {{- end }}
  # retainAfterSeconds: nil → null sentinel reaches the runtime as None and
  # ttlSecondsAfterFinished is omitted from the Job entirely (audit retention).
  {{- if kindIs "invalid" .Values.taskpods.persistence.retainAfterSeconds }}
  POIESIS_JOB_TTL_SECONDS: "null"
  {{- else }}
  POIESIS_JOB_TTL_SECONDS: {{ .Values.taskpods.persistence.retainAfterSeconds | quote }}
  {{- end }}

  # ---- Operator-supplied TaskPod extensions ---------------------------------
  # Serialised as JSON arrays so the API can decode them at startup. Empty
  # lists are omitted entirely; the runtime defaults to [] when unset.
  # Reserved-name collisions (env starting with POIESIS_, volumes named
  # task-data/postgres-ca/tmp) are rejected at API startup.
  {{- with .Values.taskpods.extraEnv }}
  POIESIS_TASKPOD_EXTRA_ENV: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.extraVolumes }}
  POIESIS_TASKPOD_EXTRA_VOLUMES: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.extraVolumeMounts }}
  POIESIS_TASKPOD_EXTRA_VOLUME_MOUNTS: {{ toJson . | quote }}
  {{- end }}

  {{- with .Values.s3.endpoint }}
  AWS_ENDPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.s3.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}

  # ---- OIDC auth -------------------------------------------------------------
  # When auth.enabled is false the API skips OIDC bootstrap and treats every
  # request as anonymous; only the toggle env is emitted so a misconfigured
  # downstream cannot accidentally read a stale issuer.
  POIESIS_AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  {{- if .Values.auth.enabled }}
  POIESIS_AUTH_OIDC_ISSUER: {{ .Values.auth.oidc.issuer | quote }}
  POIESIS_AUTH_OIDC_AUDIENCE: {{ .Values.auth.oidc.audience | quote }}
  POIESIS_AUTH_OIDC_JWKS_CACHE_TTL: {{ .Values.auth.oidc.jwksCacheTtl | quote }}
  POIESIS_AUTH_OIDC_CLOCK_SKEW: {{ .Values.auth.oidc.clockSkew | quote }}
  POIESIS_AUTH_OIDC_PRINCIPAL_CLAIM: {{ .Values.auth.oidc.principalClaim | quote }}
  {{- with .Values.auth.oidc.requiredScopes }}
  POIESIS_AUTH_OIDC_REQUIRED_SCOPES: {{ join "," . | quote }}
  {{- end }}
  {{- end }}

  LOG_LEVEL: {{ .Values.logLevel | quote }}
