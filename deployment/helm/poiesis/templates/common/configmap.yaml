{{/*
Non-secret runtime env for api + tctl. The taskpod image gets baked in
here so submitted tasks always pull the same tag the control plane runs.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "poiesis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "poiesis.labels" . | nindent 4 }}
  {{- with include "poiesis.commonAnnotations" . }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  POIESIS_NAMESPACE: {{ .Release.Namespace | quote }}
  POIESIS_TASKPOD_NAMESPACE: {{ include "poiesis.taskpodNamespace" . | quote }}
  POIESIS_IMAGE: {{ include "poiesis.image" (dict "component" .Values.api "root" .) | quote }}
  POIESIS_TASKPOD_SERVICE_ACCOUNT: {{ include "poiesis.serviceAccountName" (dict "role" "taskpod" "root" .) | quote }}
  POIESIS_POD_SECURITY_ENFORCE: {{ .Values.podSecurityEnforce | quote }}
  {{- with .Values.imagePullSecrets }}
  POIESIS_IMAGE_PULL_SECRETS: {{ join "," (pluck "name" .) | quote }}
  {{- end }}
  {{- with .Values.database.caConfigmap }}
  POIESIS_POSTGRES_CA_CONFIGMAP: {{ . | quote }}
  {{- end }}

  # ---- Per-task PVC contract -------------------------------------------------
  # storageClass: the kubectl "-" sentinel for "no provisioning" maps to the
  # empty string so the runtime sets storageClassName: "" on the PVC. Unset
  # passes through as unset.
  {{- $sc := .Values.taskpods.persistence.storageClass }}
  {{- if ne $sc "" }}
  POIESIS_PVC_STORAGE_CLASS: {{ ternary "" $sc (eq $sc "-") | quote }}
  {{- end }}
  POIESIS_PVC_DEFAULT_SIZE_GI: {{ .Values.taskpods.persistence.defaultSizeGi | quote }}
  POIESIS_PVC_MAX_SIZE_GI: {{ .Values.taskpods.persistence.maxSizeGi | quote }}
  POIESIS_PVC_ACCESS_MODES: {{ join "," .Values.taskpods.persistence.accessModes | quote }}
  {{- with .Values.taskpods.persistence.labels }}
  POIESIS_PVC_LABELS: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.persistence.annotations }}
  POIESIS_PVC_ANNOTATIONS: {{ toJson . | quote }}
  {{- end }}
  # retainAfterSeconds: nil → null sentinel reaches the runtime as None and
  # ttlSecondsAfterFinished is omitted from the Job entirely (audit retention).
  {{- if kindIs "invalid" .Values.taskpods.persistence.retainAfterSeconds }}
  POIESIS_JOB_TTL_SECONDS: "null"
  {{- else }}
  POIESIS_JOB_TTL_SECONDS: {{ .Values.taskpods.persistence.retainAfterSeconds | quote }}
  {{- end }}

  # ---- Outputs ---------------------------------------------------------------
  # Whether an output glob that matches no file uploads its path_prefix.
  POIESIS_OUTPUT_GLOB_FALLBACK: {{ .Values.taskpods.outputGlobFallback | default false | quote }}

  # ---- Operator-supplied TaskPod extensions ---------------------------------
  # Serialised as JSON arrays so the API can decode them at startup. Empty
  # lists are omitted entirely; the runtime defaults to [] when unset.
  # Reserved-name collisions (env starting with POIESIS_, volumes named
  # task-data/postgres-ca/tmp) are rejected at API startup.
  {{- with .Values.taskpods.extraEnv }}
  POIESIS_TASKPOD_EXTRA_ENV: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.extraVolumes }}
  POIESIS_TASKPOD_EXTRA_VOLUMES: {{ toJson . | quote }}
  {{- end }}
  {{- with .Values.taskpods.extraVolumeMounts }}
  POIESIS_TASKPOD_EXTRA_VOLUME_MOUNTS: {{ toJson . | quote }}
  {{- end }}

  {{- with .Values.s3.endpoint }}
  AWS_ENDPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.s3.region }}
  AWS_REGION: {{ . | quote }}
  {{- end }}

  # ---- Auth --------------------------------------------------------------------
  # When auth.enabled is false the API skips issuer bootstrap and treats every
  # request as anonymous; only the toggle env is emitted so a misconfigured
  # downstream cannot accidentally read a stale issuer.
  POIESIS_AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  {{- if .Values.auth.enabled }}
  POIESIS_AUTH_ISSUERS: {{ .Values.auth.issuers | toJson | quote }}
  {{- with .Values.auth.resource }}
  POIESIS_AUTH_RESOURCE: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.apiKeys }}
  {{- if hasKey . "enabled" }}
  POIESIS_AUTH_API_KEYS_ENABLED: {{ .enabled | quote }}
  {{- end }}
  {{- with .defaultTtl }}
  POIESIS_AUTH_API_KEYS_DEFAULT_TTL: {{ . | quote }}
  {{- end }}
  {{- with .maxTtl }}
  POIESIS_AUTH_API_KEYS_MAX_TTL: {{ . | quote }}
  {{- end }}
  {{- with .maxPerOwner }}
  POIESIS_AUTH_API_KEYS_MAX_PER_OWNER: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.auth.swaggerUi }}
  {{- if .issuer }}
  {{- /* The UI logs in at a trusted issuer; the API also checks this. */}}
  {{- $login := .issuer }}
  {{- $trusted := false }}
  {{- range $.Values.auth.issuers }}
  {{- if eq .issuer $login }}
  {{- $trusted = true }}
  {{- end }}
  {{- end }}
  {{- if not $trusted }}
  {{- fail (printf "auth.swaggerUi.issuer %q must be one of auth.issuers" $login) }}
  {{- end }}
  POIESIS_AUTH_SWAGGER_UI_ISSUER: {{ .issuer | quote }}
  POIESIS_AUTH_SWAGGER_UI_CLIENT_ID: {{ .clientId | quote }}
  POIESIS_AUTH_SWAGGER_UI_SCOPES: {{ .scopes | default "openid" | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  # ---- Authorization -----------------------------------------------------------
  {{- /* The global rule matched claim values of every issuer's tokens alike;
    refuse it, also empty, rather than silently drop it. */}}
  {{- if hasKey .Values.authz "requiredClaim" }}
  {{- fail "authz.requiredClaim was removed: move it to the issuer it is meant for, as auth.issuers[].requiredClaim (it applies to that issuer's tokens only), and delete authz.requiredClaim" }}
  {{- end }}
  # Always rendered, so the API's startup checks see incomplete settings.
  {{- with .Values.authz.decisionService }}
  POIESIS_AUTHZ_DECISION_SERVICE_URL: {{ .url | quote }}
  POIESIS_AUTHZ_DECISION_SERVICE_TIMEOUT: {{ .timeout | quote }}
  POIESIS_AUTHZ_DECISION_SERVICE_CLAIMS: {{ .claims | toJson | quote }}
  POIESIS_AUTHZ_DECISION_SERVICE_CREDENTIAL_FILE: {{ .credentialFile | quote }}
  {{- end }}
  POIESIS_AUTHZ_SHARING: {{ .Values.authz.sharing | default false | quote }}
  {{- /* int: large YAML numbers would otherwise render as 1e+06. */}}
  POIESIS_AUTHZ_MAX_OWNERS: {{ .Values.authz.maxOwners | default 1000 | int | quote }}
  POIESIS_AUTHZ_ADMIN_READ: {{ .Values.authz.adminRead | default false | quote }}

  # ---- Audit log ---------------------------------------------------------------
  {{- /* hasKey, not default: `default true` would turn an explicit false on. */}}
  {{- $audit := .Values.audit | default dict }}
  POIESIS_AUDIT_ENABLED: {{ (hasKey $audit "enabled" | ternary $audit.enabled true) | quote }}

  # ---- Service info ------------------------------------------------------------
  # Unset values are left out: the API keeps its built-in ones.
  {{- with .Values.serviceInfo }}
  {{- with .id }}
  POIESIS_SERVICE_INFO_ID: {{ . | quote }}
  {{- end }}
  {{- with .name }}
  POIESIS_SERVICE_INFO_NAME: {{ . | quote }}
  {{- end }}
  {{- with .description }}
  POIESIS_SERVICE_INFO_DESCRIPTION: {{ . | quote }}
  {{- end }}
  {{- with .organization }}
  {{- with .name }}
  POIESIS_SERVICE_INFO_ORGANIZATION_NAME: {{ . | quote }}
  {{- end }}
  {{- with .url }}
  POIESIS_SERVICE_INFO_ORGANIZATION_URL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .contactUrl }}
  POIESIS_SERVICE_INFO_CONTACT_URL: {{ . | quote }}
  {{- end }}
  {{- with .documentationUrl }}
  POIESIS_SERVICE_INFO_DOCUMENTATION_URL: {{ . | quote }}
  {{- end }}
  {{- with .environment }}
  POIESIS_SERVICE_INFO_ENVIRONMENT: {{ . | quote }}
  {{- end }}
  {{- with .createdAt }}
  POIESIS_SERVICE_INFO_CREATED_AT: {{ . | quote }}
  {{- end }}
  {{- end }}

  LOG_LEVEL: {{ .Values.logLevel | quote }}
