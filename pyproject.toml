[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
code_quality = ["deptry", "ruff", "ty", "typos"]
types = [
  "boto3-stubs",
  "kubernetes-stubs",
  "types-botocore",
  "types-pyyaml",
  "types-requests",
]

[project]
authors = [{ email = "jh4official@gmail.com", name = "Javed Habib" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "boto3",
  "botocore",
  "click",
  "connexion[swagger-ui, uvicorn]",
  "gunicorn",
  "kubernetes",
  "pydantic",
  "requests",
  "tomli",
]
description = "TES on kubernetes"
keywords = [
  "automation",
  "cloud",
  "devops",
  "ga4gh",
  "infrastructure",
  "kubernetes",
  "tes",
]
license = "Apache-2.0"
maintainers = [{ email = "jh4official@gmail.com", name = "Javed Habib" }]
name = "poiesis"
readme = "README.md"
requires-python = ">=3.13.0,<3.14"
version = "0.2.0"

[project.scripts]
poiesis = "poiesis.cli.main:main"

[project.urls]
Documentation = "https://poiesis.vercel.app"
Issues = "https://github.com/jaeaeich/poiesis/issues"
Repository = "https://github.com/jaeaeich/poiesis"

[tool.deptry]
known_first_party = ["poiesis"]

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "A001",
  "A002", # TES spec uses `type`, `id`, `input` — builtin shadows are intentional
  # Annotation rules — aspirational; revisit after v2 lands
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN205",
  "ANN206",
  "ANN401", # Any in annotations — sometimes intentional
  "ARG001",
  "ARG002", # unused args — connexion handler signatures (FastAPI rewrite)
  "ASYNC",  # asyncio patterns — revisit during TRec/API rewrites
  "COM812", # conflicts with formatter
  # Style preferences we don't share
  "D203", # one-blank-line-before-class (we use D211)
  "D213", # multi-line-summary-second-line (we use D212)
  "D401", # imperative-mood docstrings — too prescriptive
  # Format-owned
  "E501",  # line length is enforced by ruff-format
  "EM101",
  "EM102", # exception literal/f-string — same
  # TODO / fixme metadata rules — pedantic for a small team
  "FIX002",
  # Cosmetic / opinionated rules that don't pay for themselves
  "G004",   # f-strings in logging — readability > theoretical perf
  "ISC001", # conflicts with formatter
  # Naming exceptions driven by external schemas
  "N802",
  "N815",   # TES spec field names (camelCase from OpenAPI)
  "PGH003", # blanket type: ignore — kubernetes-stubs gaps drive these
  # Deferred to the v2 slices that rewrite the affected modules.
  # Drop these once the filer-strategy / K8s-adapter / API rewrites land.
  "PTH", # os.path → pathlib — bulk migration in filer-strategy rewrite
  # CLI / script ergonomics
  "S101",   # asserts — used as invariants in dev code
  "SLF001", # private member access — kubernetes client internals
  "TD002",
  "TD003",
  "TRY003", # long messages outside exception class — bulk noise
  "TRY300",
  "TRY301", # try/except restructuring — incremental in v2
  "TRY400", # logger.exception vs logger.error — covered by review
]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
exclude = ["**/.venv/**", "**/__pycache__/**"]

[tool.typos.default.extend-words]
mis = 'mis'
ser = 'ser'

[tool.typos.files]
extend-exclude = [
  "*.gif",
  "*.ico",
  "*.jpeg",
  "*.jpg",
  "*.lock",
  "*.png",
  "*.svg",
  "*.ttf",
  "*.woff",
  "*.woff2",
  ".venv/",
  "docs/app/node_modules/",
  "docs/app/public/",
  "uv.lock",
]
