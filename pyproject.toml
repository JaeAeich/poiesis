[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
code_quality = ["deptry", "ruff", "ty", "typos"]
test = ["pyftpdlib", "pytest"]
types = ["asyncpg-stubs", "kubernetes-stubs", "types-pyyaml", "types-requests"]

[project]
authors = [{email = "jh4official@gmail.com", name = "Javed Habib"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "asyncpg",
  "click",
  "fastapi",
  "gunicorn",
  "httpx",
  "joserfc",
  "kubernetes",
  "obstore",
  "prometheus-client",
  "pydantic",
  "requests",
  "urllib3",
  "uvicorn",
]
description = "TES on kubernetes"
keywords = [
  "automation",
  "cloud",
  "devops",
  "ga4gh",
  "infrastructure",
  "kubernetes",
  "tes",
]
license = "Apache-2.0"
maintainers = [{email = "jh4official@gmail.com", name = "Javed Habib"}]
name = "poiesis"
readme = "README.md"
requires-python = ">=3.13.0,<3.14"
version = "0.2.0"

[project.scripts]
poiesis = "poiesis.cli.main:main"

[project.urls]
Documentation = "https://poiesis.vercel.app"
Issues = "https://github.com/jaeaeich/poiesis/issues"
Repository = "https://github.com/jaeaeich/poiesis"

[tool.deptry]
known_first_party = ["poiesis"]

[tool.deptry.per_rule_ignores]
# uvicorn is loaded by gunicorn via the worker_class string
# "uvicorn.workers.UvicornWorker" in asgi.py — deptry can't see it.
DEP002 = ["uvicorn"]

[tool.pytest.ini_options]
# The end-to-end tests need a cluster: run them with `pytest tests/e2e`.
addopts = "-m 'not slow'"
markers = ["slow: takes minutes; left out unless selected with -m slow"]
testpaths = ["tests/unit"]

[tool.ruff]
indent-width = 4
line-length = 88

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
ignore = [
  "A002", # TES spec uses `type`, `id`, `input` — builtin shadows are intentional
  # Annotation rules — aspirational; revisit after v2 lands
  "ANN001",
  "ANN401", # Any in annotations — sometimes intentional
  "ARG001", # unused args — Starlette handler signatures
  "ASYNC", # asyncio patterns — revisit during TRec/API rewrites
  "COM812", # conflicts with formatter
  # Style preferences we don't share
  "D203", # one-blank-line-before-class (we use D211)
  "D213", # multi-line-summary-second-line (we use D212)
  "D401", # imperative-mood docstrings — too prescriptive
  # Format-owned
  "E501", # line length is enforced by ruff-format
  "EM101",
  "EM102", # exception literal/f-string — same
  # Cosmetic / opinionated rules that don't pay for themselves
  "G004", # f-strings in logging — readability > theoretical perf
  "ISC001", # conflicts with formatter
  # Naming exceptions driven by external schemas
  "N802",
  "N815", # TES spec field names (camelCase from OpenAPI)
  # Deferred to the v2 slices that rewrite the affected modules.
  # Drop these once the filer-strategy / K8s-adapter / API rewrites land.
  "PTH", # os.path → pathlib — bulk migration in filer-strategy rewrite
  # CLI / script ergonomics
  "S101", # asserts — used as invariants in dev code
  "TRY003", # long messages outside exception class — bulk noise
  "TRY300",
  "TRY301", # try/except restructuring — incremental in v2
  "TRY400", # logger.exception vs logger.error — covered by review
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# The Gunicorn subclasses follow Gunicorn's untyped signatures.
"poiesis/api/asgi.py" = ["ANN", "ARG002"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ty.src]
exclude = ["**/.venv/**", "**/__pycache__/**"]

[tool.typos.default.extend-words]
AKS = 'AKS' # Azure Kubernetes Service
mis = 'mis'
ser = 'ser'

[tool.typos.files]
extend-exclude = [
  "*.gif",
  "*.ico",
  "*.jpeg",
  "*.jpg",
  "*.lock",
  "*.png",
  "*.svg",
  "*.ttf",
  "*.woff",
  "*.woff2",
  ".venv/",
  "docs/app/node_modules/",
  "docs/app/public/",
  "uv.lock",
]
